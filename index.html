<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1c17">
<title>Hagestraat · Vermogensmodel</title>
<style>
  /* Apple-style system font stack, no web fonts */
  :root{
    /* warm dark taupe glass palette (better contrast) */
    --bg:#312d29;
    --bg-grad-a:#403a34; --bg-grad-b:#2e2a26; --bg-grad-c:#24211d;
    --glass:rgba(255,255,255,.09);
    --glass-strong:rgba(255,255,255,.15);
    --glass-soft:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.16);
    --line2:rgba(255,255,255,.10);
    --ink:#fcfbf9;
    --muted:#d9d4cc;
    --muted2:#a9a298;
    --accent:#5fd07a;          /* iOS green */
    --accent-solid:#34c759;
    --accent-ink:#0f2a16;
    --accent-dim:rgba(95,208,122,.22);
    --warn:#f3c98b;
    --danger:#f2a6ad;
    --gold:#f0d9a0;
    --radius:20px; --safe-bottom:env(safe-area-inset-bottom,0px);
    --shadow:0 8px 30px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100dvh;padding-bottom:calc(86px + var(--safe-bottom));overflow-x:hidden;
    background:
      radial-gradient(1100px 700px at 85% -5%, var(--bg-grad-a), transparent 60%),
      radial-gradient(900px 600px at -10% 30%, var(--bg-grad-b), transparent 55%),
      linear-gradient(170deg, var(--bg-grad-b), var(--bg-grad-c));
    background-attachment:fixed;}
  .wrap{max-width:540px;margin:0 auto;padding:0 14px;}
  header{padding:28px 0 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .head-left{min-width:0;}
  .eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted2);font-weight:600;}
  h1{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:26px;margin-top:3px;letter-spacing:-.02em;color:var(--ink);}
  .head-right{flex:none;display:flex;align-items:center;gap:8px;margin-top:4px;}
  .eye-btn{flex:none;width:40px;height:40px;border-radius:13px;background:var(--glass);border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .18s;
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow);}
  .eye-btn svg{width:19px;height:19px;}
  .eye-btn.hidden-on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim);}
  .eye-btn:active{transform:scale(.92);}
  .intrek-badge{flex:none;height:40px;display:flex;flex-direction:column;justify-content:center;gap:1px;
    background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:0 12px;text-align:right;
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow);}
  .intrek-badge .ib-n{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:-.01em;line-height:1.05;}
  .intrek-badge .ib-n small{font-size:9px;color:var(--muted2);font-weight:600;}
  .intrek-badge .ib-k{font-size:7.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);font-weight:600;}
  /* verborgen bedragen */
  .amount-hidden{filter:blur(8px);-webkit-filter:blur(8px);opacity:.85;user-select:none;pointer-events:none;}
  body.hide-amounts .amt{filter:blur(7px);-webkit-filter:blur(7px);opacity:.9;user-select:none;}

  .tabs{display:flex;gap:5px;margin:18px 0 16px;background:var(--glass-soft);padding:5px;border-radius:16px;border:1px solid var(--line2);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);}
  .tabs button{flex:1;background:transparent;border:none;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;padding:11px 4px;border-radius:12px;cursor:pointer;transition:all .2s;}
  .tabs button.active{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(60,54,48,.20);}

  .view{display:none;animation:fade .3s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .intro{font-size:12.5px;color:var(--muted);line-height:1.55;margin:14px 4px 14px;}

  /* glass card base */
  .card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:11px;
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);}

  .mrow{padding:15px 17px;cursor:pointer;position:relative;transition:background .2s;}
  .mrow::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-dim);}
  .mrow.low::before{background:rgba(243,201,139,.5);}
  .mrow.neg::before{background:rgba(242,166,173,.6);}
  .mrow.past{opacity:.55;}
  /* current month highlight */
  .mrow-wrap.now-wrap{border-color:rgba(95,208,122,.55);box-shadow:0 0 0 1px rgba(95,208,122,.35), var(--shadow);}
  .mrow.now{background:linear-gradient(100deg,rgba(95,208,122,.16),rgba(95,208,122,.05));}
  .mrow.now::before{background:var(--accent-solid);}
  .mrow.now .now-badge{font-size:8.5px;letter-spacing:.12em;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:middle;}
  .mtop{display:flex;justify-content:space-between;align-items:baseline;}
  .mtitle{font-weight:600;font-size:16px;}
  .mtitle .yr{color:var(--muted2);font-weight:400;font-size:11px;margin-left:5px;}
  .mend{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .mend.low{color:var(--warn);} .mend.neg{color:var(--danger);}
  .mflow{display:flex;gap:7px;margin-top:10px;font-size:11.5px;flex-wrap:wrap;}
  .mchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
  .mchips .pchip{font-size:10px;font-weight:500;color:var(--muted2);background:var(--glass-soft);border:1px solid var(--line2);padding:3px 9px;border-radius:999px;letter-spacing:.01em;}
  .mchips .pchip-main{color:var(--accent);background:var(--accent-dim);border-color:transparent;font-weight:600;}
  .past-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--glass-soft);border:1px solid var(--line2);color:var(--muted);font-size:12.5px;font-weight:600;padding:11px;border-radius:14px;margin-bottom:10px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:color .15s;}
  .past-toggle:active{color:var(--ink);}
  .past-toggle .chev{font-size:11px;transition:transform .25s;}
  .past-toggle.open .chev{transform:rotate(180deg);}
  .past-group{display:none;}
  .past-group.show{display:block;animation:fade .25s ease;}
  .pill{background:var(--glass-soft);border:1px solid var(--line2);padding:4px 10px;border-radius:999px;color:var(--muted2);}
  .pill b{font-weight:600;}
  .pill.in b{color:var(--accent);} .pill.out b{color:var(--danger);} .pill.begin b{color:var(--ink);}
  .mdetail{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--glass-soft);}
  .mrow-wrap.open .mdetail{max-height:900px;}
  .mrow-wrap.open .mrow{background:var(--glass-soft);}
  .mdetail-in{padding:4px 17px 15px;}
  .dline{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line2);}
  .dline:last-child{border-bottom:none;}
  .dline .l{color:var(--muted2);display:flex;align-items:center;gap:8px;}
  .dline .r{font-weight:600;}
  .dline .l .pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;border:1.5px solid var(--muted2);background:transparent;}
  .dline .l .pdot.done{background:var(--accent);border-color:var(--accent);}
  .dline .l .pdot.some{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent);}
  .dline .l .pcount{font-size:10px;color:var(--muted2);opacity:.7;}
  .dsub{font-size:10.5px;color:var(--muted2);padding:7px 0 2px;letter-spacing:.07em;text-transform:uppercase;}

  .strip{display:flex;gap:9px;margin:12px 0;}
  .scell{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 13px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);}
  .scell .k{font-size:10.5px;color:var(--muted2);}
  .scell .v{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:18px;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .scell .v.green{color:var(--accent);} .scell .v.gold{color:var(--gold);} .scell .v.warn{color:var(--warn);} .scell .v.neg{color:var(--danger);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:13px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);}
  .month-nav button{background:var(--glass-strong);border:1px solid var(--line2);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;transition:background .15s;}
  .month-nav button:active{background:var(--accent-dim);}
  .month-nav .mlabel{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:18px;text-align:center;letter-spacing:-.01em;}
  .month-nav .mlabel small{display:block;font-size:9.5px;color:var(--muted2);font-weight:400;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;}

  .bgroup-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);margin:16px 6px 8px;display:flex;justify-content:space-between;}
  .brow{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line2);}
  .brow:last-child{border-bottom:none;}
  .brow .nm{font-size:14px;display:flex;align-items:center;gap:8px;}
  .brow .nm .rec{font-size:8.5px;color:var(--accent);border:1px solid var(--accent-dim);padding:1px 6px;border-radius:6px;letter-spacing:.05em;}
  .brow .nm .rec.ovr{color:var(--warn);border-color:rgba(243,201,139,.4);}
  .brow .fixedit{cursor:pointer;}
  .brow .amt.fixedit{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
  .scope-seg button.act-in{background:var(--accent-dim);border-color:var(--accent);color:var(--ink);}
  .scope-seg button.act-out{background:rgba(243,201,139,.2);border-color:var(--warn);color:var(--ink);}
  .brow .amt{font-weight:600;font-size:14px;}
  .brow .amt.in{color:var(--accent);} .brow .amt.out{color:var(--danger);}
  .brow .del{color:var(--muted2);opacity:.4;font-size:14px;padding-left:10px;}
  .brow .del:active{color:var(--danger);opacity:1;}
  /* sleep-handle om volgorde te wijzigen */
  .drag-h{flex:0 0 auto;color:var(--muted2);opacity:.4;font-size:15px;cursor:grab;touch-action:none;padding:0 4px;line-height:1;user-select:none;-webkit-user-select:none;}
  .drag-h:active{cursor:grabbing;opacity:.8;}
  .brow .nm .drag-h{margin-right:2px;}
  .dragging{opacity:.96;box-shadow:0 12px 30px rgba(0,0,0,.45);border-radius:14px;transition:box-shadow .15s;}
  .drop-line{height:0;border-top:2px solid var(--accent);margin:-1px 6px;border-radius:2px;box-shadow:0 0 6px rgba(95,208,122,.5);pointer-events:none;}
  .btotal{display:flex;justify-content:space-between;padding:15px;background:var(--glass-strong);font-weight:600;border-top:1px solid var(--line);}
  .btotal .v{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .btotal .v.over{color:var(--accent);}

  .proj{margin-bottom:11px;}
  .proj-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:15px 17px;cursor:pointer;}
  .proj-h .drag-h{margin-top:2px;}
  .proj-h .figs{margin-top:1px;}
  .proj-h .proj-drag{font-size:15px;}
  .proj-h .proj-caret{flex:0 0 auto;color:var(--muted2);opacity:.45;font-size:13px;transition:transform .25s;margin-top:3px;}
  .proj.open .proj-h .proj-caret{transform:rotate(180deg);}
  .proj-h .nm{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;}
  .proj-h .nm .nm-top{display:flex;align-items:center;gap:8px;min-width:0;}
  .proj-h .nm .nm-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .proj.open .proj-h .nm .pn{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;}
  .proj.open .proj-h .nm .pn:active{text-decoration-color:var(--muted2);}
  .proj.open .proj-h .nm .mnwrap{cursor:pointer;}
  .proj-h .nm .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proj-h .nm .mnwrap{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto;}
  .proj-h .nm .mn{font-size:10px;padding:3px 8px;border-radius:7px;font-weight:600;letter-spacing:.02em;}
  .proj-h .nm .mn-main{color:var(--accent);background:var(--accent-dim);}
  .proj-h .nm .mn-sub{color:var(--muted2);background:var(--glass-soft);font-weight:500;opacity:.85;}
  .proj-h .figs{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .proj-h .figs b{font-size:16px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15;}
  .proj-h .figs b.done{color:var(--accent);}
  .proj-h .figs b.over{color:var(--warn);}
  .proj-h .figs .sub{font-size:10.5px;color:var(--muted2);font-variant-numeric:tabular-nums;}
  .proj-h .nm .paybadge{flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .proj-h .nm .paybadge.all{color:var(--accent-ink);background:var(--accent);}
  .proj-h .nm .paybadge.some{color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-dim);}
  .proj-h .nm .paybadge.deduct{color:var(--gold);background:rgba(240,217,160,.13);border:1px solid rgba(240,217,160,.3);}
  .proj.allpaid .proj-h .nm .pn{color:var(--muted);}
  .proj.allpaid{opacity:.82;}
  .proj-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .proj.open .proj-body{max-height:1600px;}
  /* gedeelde kolom-uitlijning: vinkje | naam | begroot | realiteit | verwijder */
  .pcols-head,.pitem,.ptot{display:grid;grid-template-columns:24px 1fr 80px 80px 22px;align-items:center;gap:6px;padding:0 17px;}
  .pcols-head{height:30px;border-top:1px solid var(--line2);color:var(--muted2);font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;}
  .pcols-head .ch-num{text-align:right;}
  .pitem{min-height:46px;padding-top:9px;padding-bottom:9px;border-top:1px solid var(--line2);font-size:13px;}
  .pitem .chk{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent-ink);cursor:pointer;transition:all .15s;}
  .pitem .chk.on{background:var(--accent);border-color:var(--accent);font-weight:700;}
  .pitem .pname{min-width:0;}
  .pitem .pname .t{display:flex;align-items:center;gap:6px;font-weight:500;min-width:0;}
  .pitem .pname .t .drag-h{flex:0 0 auto;font-size:13px;}
  .pitem .pname .t .nmtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pitem .pname .meta{display:flex;align-items:center;gap:7px;margin-top:4px;}
  .pitem .pname .imn{font-size:9px;color:var(--muted2);background:var(--glass-soft);border:1px solid var(--line2);padding:1px 6px;border-radius:6px;font-weight:600;letter-spacing:.03em;}
  .pitem .pname .dt{font-size:9.5px;color:var(--muted2);}
  .pitem .pedit{cursor:pointer;}
  .col-beg{text-align:right;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;}
  .col-rea{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}
  .col-rea.filled{color:var(--accent);}
  .col-rea.over{color:var(--warn);}
  .col-rea.empty{color:var(--muted2);font-weight:400;}
  .col-rea.est{color:var(--muted2);font-weight:400;font-style:italic;}
  .pitem .x{color:var(--muted2);opacity:.3;text-align:center;font-size:13px;}
  .pitem .x:active{color:var(--danger);opacity:1;}
  /* betaald: doorgestreept maar leesbaar */
  .pitem.paid .pname .t{text-decoration:line-through;text-decoration-color:var(--muted2);color:var(--muted2);}
  .pitem.paid .col-beg,.pitem.paid .col-rea{text-decoration:line-through;text-decoration-color:var(--muted2);opacity:.7;}
  .pitem.paid .col-rea.filled{color:var(--accent);opacity:.85;}
  .pitem.paid .col-rea.over{color:var(--warn);opacity:.85;}
  .proj-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line2);}
  .padd{padding:13px 17px;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;}
  .padd:active{opacity:.6;}
  .paidall{padding:13px 17px;color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .paidall:active{color:var(--accent);}
  /* totaal: duidelijk afgescheiden */
  .ptot{min-height:50px;padding-top:13px;padding-bottom:13px;border-top:2px solid var(--line);background:var(--glass-strong);}
  .ptot .ptot-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink);}
  .ptot .col-beg{font-size:14px;font-weight:600;color:var(--muted);}
  .ptot .col-rea{font-size:15px;font-weight:700;color:var(--ink);}
  .ptot .col-rea.filled{color:var(--accent);}
  .ptot .col-rea.over{color:var(--warn);}
  .new-proj{width:100%;background:var(--glass-soft);border:1px dashed var(--line);color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;padding:15px;border-radius:16px;cursor:pointer;margin-bottom:11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  /* huis-overzicht bovenaan projecten */
  .house-card{margin-top:6px;margin-bottom:14px;}
  .house-h{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 17px;cursor:pointer;}
  .house-h .house-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);font-weight:600;}
  .house-h .house-net{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px;}
  .house-h .house-sub{font-size:11.5px;color:var(--muted2);margin-top:2px;}
  .house-h .house-cog{flex:0 0 auto;color:var(--muted2);opacity:.5;font-size:15px;}
  .house-h:active .house-cog{opacity:1;color:var(--accent);}
  .house-detail{padding:4px 17px 15px;border-top:1px solid var(--line2);}
  .house-detail .hline{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line2);}
  .house-detail .hline:last-child{border-bottom:none;}
  .house-detail .hline .l{color:var(--muted2);}
  .house-detail .hline .r{font-weight:600;font-variant-numeric:tabular-nums;}
  .house-detail .hline.tot{margin-top:2px;border-top:1px solid var(--line);padding-top:11px;}
  .house-detail .hline.tot .l{color:var(--ink);font-weight:600;}
  .house-detail .hline.tot .r{font-size:14px;font-weight:700;color:var(--accent);}
  .house-extra{margin-top:2px;border-top:2px solid var(--line);}
  .house-detail .hline.grand{cursor:pointer;border-bottom:none;padding-top:12px;}
  .house-detail .hline.grand .l{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:6px;}
  .house-detail .hline.grand .r{font-size:15px;font-weight:700;color:var(--accent);}
  .house-extra .hcaret{font-size:11px;color:var(--muted2);transition:transform .25s;display:inline-block;}
  .house-extra.open .hcaret{transform:rotate(180deg);}
  .house-extra-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .house-extra.open .house-extra-body{max-height:400px;}
  .house-extra-note{font-size:11px;color:var(--muted2);line-height:1.5;padding:6px 0 2px;}

  /* ===== Planning (Gantt) ===== */
  .plan-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 6px;}
  .plan-strip .pcell{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:13px 12px;
    backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:78px;display:flex;flex-direction:column;}
  .plan-strip .pcell.ms{cursor:pointer;transition:border-color .18s;}
  .plan-strip .pcell.ms:active{border-color:var(--gold);}
  .plan-strip .pcell .pk{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);font-weight:600;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:24px;}
  .plan-strip .pcell .pv{font-size:24px;font-weight:700;margin-top:auto;letter-spacing:-.02em;line-height:1.05;}
  .plan-strip .pcell .pv.sm{font-size:18px;}
  .plan-strip .pcell .psub{font-size:10px;color:var(--muted2);margin-top:2px;font-weight:500;}
  .pv.green{color:var(--accent);} .pv.warn{color:var(--warn);} .pv.gold{color:var(--gold);} .pv.blue{color:#7fb4f0;}


  .plan-filters{display:flex;gap:5px;margin:12px 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .plan-filters::-webkit-scrollbar{display:none;}
  .plan-filters button{flex:1 1 0;white-space:nowrap;background:var(--glass-soft);border:1px solid var(--line2);color:var(--muted);font-family:inherit;font-weight:600;font-size:11.5px;
    padding:7px 6px;border-radius:999px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;}
  .plan-filters button.active{background:var(--glass-strong);color:var(--ink);border-color:var(--line);}
  .plan-filters button .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}

  /* mode toggle */
  .plan-mode{display:flex;gap:5px;background:var(--glass-soft);padding:4px;border-radius:13px;border:1px solid var(--line2);margin:0 2px 12px;}
  .plan-mode button{flex:1;background:transparent;border:none;color:var(--muted);font-family:inherit;font-weight:600;font-size:12.5px;padding:9px;border-radius:10px;cursor:pointer;transition:all .2s;}
  .plan-mode button.active{background:var(--glass-strong);color:var(--ink);}

  /* Gantt — alleen kijken, horizontaal scrollbaar t/m 1 aug */
  .gantt{background:var(--glass);border:1px solid var(--line);border-radius:18px;overflow:visible;position:relative;
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);}
  .gantt-headwrap{position:sticky;top:0;z-index:8;overflow:hidden;border-radius:17px 17px 0 0;border-bottom:1px solid var(--line);background:#2c2723;
    box-shadow:0 6px 14px rgba(0,0,0,.16);}
  .gantt-headwrap .gh-label-fixed{position:absolute;left:0;top:0;bottom:0;z-index:9;width:var(--labelw);background:#2c2723;border-radius:17px 0 0 0;
    border-right:1px solid var(--line);font-size:9.5px;color:var(--muted2);font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    display:flex;align-items:center;padding:0 12px;}
  .gantt-scroll{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;}
  .gantt-inner{position:relative;}
  .gantt-head{display:flex;background:#2c2723;}
  .gantt-head .gh-label{flex:none;width:var(--labelw);}
  .gantt-head .gh-weeks{display:flex;}
  .gh-week{flex:none;text-align:center;padding:7px 0 6px;border-left:1px solid var(--line2);font-weight:600;box-sizing:border-box;}
  .gh-week .gw-no{font-size:10px;color:var(--muted);}
  .gh-week .gw-dates{font-size:9px;color:var(--muted2);margin-top:1px;font-weight:500;white-space:nowrap;}
  .gh-week.now{background:var(--accent-dim);}
  .gh-week.now .gw-no{color:var(--accent);}

  .gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:3;pointer-events:none;opacity:.95;}
  .gantt-today::before{content:"vandaag";position:absolute;top:2px;left:4px;font-size:8.5px;color:var(--accent);font-weight:700;white-space:nowrap;}
  .gantt-nowweek{position:absolute;top:0;bottom:0;background:var(--accent-dim);opacity:.5;z-index:1;pointer-events:none;}
  /* expliciete weekrasterlijnen, exact uitgelijnd met de header */
  .gantt-grid{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none;}
  .gantt-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);opacity:.6;}

  .gantt-rows{position:relative;}
  .grow{display:flex;align-items:stretch;min-height:46px;border-top:1px solid var(--line2);position:relative;}
  .grow:first-child{border-top:none;}
  /* sticky labelkolom: vrijwel dicht, alleen vage gloed van de balken schijnt door */
  .grow .g-label{flex:none;width:var(--labelw);position:sticky;left:0;z-index:5;cursor:pointer;
    background:rgba(40,36,32,.86);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);
    border-right:1px solid var(--line);padding:9px 10px 9px 13px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
  .grow .g-label .gl-t{font-size:11px;font-weight:600;color:var(--ink);line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .grow.expanded .g-label .gl-t{-webkit-line-clamp:unset;display:block;overflow:visible;white-space:normal;}
  .grow .g-label .gl-t .ms-dot{color:var(--gold);font-size:9px;}
  .grow .g-label .gl-d{font-size:9px;color:var(--muted2);font-weight:500;display:flex;align-items:center;gap:4px;}
  .grow .g-label .gl-d .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .grow.done{background:rgba(95,208,122,.07);}
  .grow.done .gl-t{text-decoration:line-through;color:var(--muted2);}
  .grow.done .g-label{background:rgba(40,46,40,.88);}
  .g-track{position:relative;flex:1;min-height:46px;}

  .gbar{position:absolute;top:9px;height:28px;border-radius:9px;display:flex;align-items:center;gap:6px;padding:0 8px;
    background:var(--bar-c);border:1px solid var(--bar-bd);box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .gbar .gb-check{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;}
  .gbar .gb-txt.in{font-size:10.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gbar .gb-txt.out{position:absolute;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:600;color:var(--ink);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .gbar.s-done{opacity:.55;}
  .gbar.s-done .gb-check{background:#fff;color:var(--accent-ink);border-color:#fff;}
  .gbar.s-busy{box-shadow:0 0 0 2px var(--warn) inset,0 2px 8px rgba(0,0,0,.2);}
  .gbar.s-busy .gb-check{border-color:#fff;color:#fff;}

  .gms{position:absolute;top:50%;left:0;width:22px;height:22px;transform:translate(-50%,-50%) rotate(45deg);
    background:var(--gold);border:1.5px solid #fff3d6;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:2;border-radius:4px;
    display:flex;align-items:center;justify-content:center;}
  .gms .gms-check{transform:rotate(-45deg);font-size:11px;color:var(--accent-ink);font-weight:800;}
  .gms.s-done{background:var(--accent);border-color:#d6f5dd;}
  .gms-flag{position:absolute;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:var(--gold);white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .gantt-hint{font-size:10px;color:var(--muted2);text-align:center;padding:9px 12px;line-height:1.5;border-top:1px solid var(--line2);}

  /* ===== Lijst-weergave (werkplek, Projecten-stijl) ===== */
  .pl-phase{margin-bottom:18px;}
  .pl-phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 7px;}
  .pl-pname{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em;cursor:pointer;
    background:transparent;border:none;font-family:inherit;display:inline-flex;align-items:center;gap:6px;padding:3px 0;}
  .pl-pname .pl-pen{font-size:11px;color:var(--muted2);opacity:.7;}
  .pl-pname:active{color:var(--accent);}
  .pl-pmeta{font-size:11px;color:var(--muted2);font-weight:600;font-variant-numeric:tabular-nums;}
  .pl-pbar{height:4px;border-radius:3px;background:var(--glass-soft);overflow:hidden;margin:0 4px 10px;}
  .pl-pbar i{display:block;height:100%;background:var(--accent);transition:width .4s;}
  .pl-empty{font-size:11.5px;color:var(--muted2);text-align:center;padding:10px;border:1px dashed var(--line2);border-radius:12px;}

  /* drop-indicator tijdens slepen */
  .pl-dropline{height:0;border-top:2px solid var(--accent);margin:2px 0;border-radius:2px;box-shadow:0 0 8px var(--accent-dim);}
  .pl-list.drop-target{outline:2px dashed var(--accent-dim);outline-offset:2px;border-radius:14px;}

  /* swipe-to-delete */
  .pl-swipe{position:relative;margin-bottom:8px;border-radius:15px;}
  .pl-swipe-bg{position:absolute;inset:0;border-radius:15px;display:flex;align-items:center;justify-content:flex-end;
    padding-right:22px;overflow:hidden;opacity:0;transition:opacity .15s;
    background:linear-gradient(90deg,rgba(214,90,98,.18),rgba(214,90,98,.42));}
  .pl-swipe-bg span{color:#f4c4c8;font-weight:700;font-size:13px;letter-spacing:.02em;}
  .pl-swipe.arming .pl-swipe-bg{background:linear-gradient(90deg,rgba(214,90,98,.3),rgba(214,90,98,.6));}
  .pl-swipe.arming .pl-swipe-bg span{color:#fff;}
  /* kaart krijgt ondoorzichtige basis zodat de rode laag er niet doorheen schijnt in ruststand */
  .pl-swipe .pl-card{margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;
    background:linear-gradient(var(--glass),var(--glass)),var(--bg);}
  .pl-swipe .pl-card.is-ms{background:linear-gradient(120deg,rgba(240,217,160,.12),var(--glass)),var(--bg);}

  .pl-card{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:15px;
    padding:13px 14px;position:relative;overflow:hidden;cursor:pointer;
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow);}
  .pl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--oc,var(--accent-dim));}
  .pl-card.done{}
  .pl-card.done .pl-main,.pl-card.done .pl-bookmark{opacity:.6;}
  .pl-swipe .pl-card.done{background:linear-gradient(rgba(95,208,122,.06),rgba(95,208,122,.06)),var(--bg);}
  .pl-card.is-ms{border-color:rgba(240,217,160,.5);background:linear-gradient(120deg,rgba(240,217,160,.12),var(--glass));}
  .pl-card.pl-dragging{z-index:50;box-shadow:0 12px 36px rgba(0,0,0,.4);opacity:.97;cursor:grabbing;}
  .pl-card .pl-drag{flex:none;display:flex;align-items:center;color:var(--muted2);opacity:.4;font-size:16px;cursor:grab;touch-action:none;
    user-select:none;-webkit-user-select:none;margin-left:-3px;}
  .pl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-right:8px;}
  .pl-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.25;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px;}
  .pl-card.done .pl-name{text-decoration:line-through;text-decoration-color:var(--muted2);color:var(--muted);}
  .pl-owner{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;}
  .pl-owner .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .pl-dates{font-size:11px;color:var(--muted2);font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;}
  .pl-ms-tag{font-size:8.5px;font-weight:700;color:var(--accent-ink);background:var(--gold);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;}
  /* mijlpaal-bookmark rechtsboven */
  .pl-bookmark{position:absolute;top:0;right:13px;width:26px;height:32px;background:transparent;border:none;cursor:pointer;padding:0;z-index:3;
    display:flex;align-items:flex-start;justify-content:center;}
  .pl-bookmark svg{fill:var(--line2);stroke:var(--muted2);stroke-width:1.3;transition:all .18s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));}
  .pl-bookmark.on svg{fill:var(--gold);stroke:#fff3d6;}
  .pl-bookmark:active{transform:translateY(1px);}
  .pl-status{flex:none;align-self:center;min-width:64px;text-align:center;font-family:inherit;font-weight:700;font-size:11px;
    letter-spacing:.02em;padding:9px 12px;border-radius:11px;cursor:pointer;border:1px solid var(--line2);
    color:var(--sc);background:var(--sbg);transition:all .15s;}
  .pl-status:active{transform:scale(.94);}

  .lnk-btn{background:transparent;border:none;color:var(--accent);font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;padding:6px 2px;margin-top:-4px;}
  .del-btn{width:100%;background:rgba(242,166,173,.14);color:var(--danger);border:1px solid rgba(242,166,173,.25);
    font-family:inherit;font-weight:600;font-size:14px;padding:14px;border-radius:15px;margin-top:8px;cursor:pointer;transition:background .15s;box-shadow:none;}
  .del-btn:active{background:rgba(242,166,173,.22);}
  .date-hint{font-size:10.5px;color:var(--muted2);margin:7px 2px 0;line-height:1.4;}

  /* date inputs + owner keuze in sheet */
  .date-row{display:flex;gap:10px;}
  .date-row .field{flex:1;}
  input[type=date]{color-scheme:dark;}
  .own-row{display:flex;gap:6px;flex-wrap:wrap;}
  .own-row .own-btn{flex:1;min-width:70px;background:var(--glass-soft);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-weight:600;font-size:12px;
    padding:10px 6px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s;}
  .own-row .own-btn .dot{width:9px;height:9px;border-radius:50%;}
  .own-row .own-btn.active{background:var(--glass-strong);color:var(--ink);border-color:var(--oc);}

  /* eigen kalender */
  .cal{background:var(--glass-soft);border:1px solid var(--line);border-radius:14px;padding:9px 9px 10px;max-width:340px;margin:0 auto;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .cal-title{font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
  .cal-nav{width:27px;height:27px;border-radius:8px;background:var(--glass);border:1px solid var(--line2);color:var(--muted);
    font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .cal-nav:active{transform:scale(.9);}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;}
  .cal-dow span{text-align:center;font-size:9px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.03em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cd{aspect-ratio:1;border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:12px;font-weight:500;
    border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;position:relative;}
  .cd.empty{pointer-events:none;}
  .cd:not(.empty):active{transform:scale(.92);}
  .cd.in{background:var(--accent-dim);border-radius:0;}
  .cd.start{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:8px 0 0 8px;}
  .cd.end{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:0 8px 8px 0;}
  .cd.single{border-radius:8px;}
  .cal-sum{font-size:11px;color:var(--muted);font-weight:500;margin-top:7px;text-align:center;}

  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-bottom));z-index:40;
    background:var(--glass-strong);color:var(--ink);border:1px solid rgba(255,255,255,.22);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:14.5px;
    padding:14px 24px;border-radius:999px;display:flex;align-items:center;gap:8px;
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 10px 32px rgba(60,54,48,.34);cursor:pointer;transition:transform .12s;}
  .fab:active{transform:translateX(-50%) scale(.95);}
  .fab .plus{font-size:19px;margin-top:-2px;color:var(--accent);}

  .scrim{position:fixed;inset:0;background:rgba(15,13,11,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(52,47,42,.82);border-top:1px solid rgba(255,255,255,.2);
    border-radius:28px 28px 0 0;padding:6px 18px calc(24px + var(--safe-bottom));transform:translateY(110%);
    backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
    transition:transform .35s cubic-bezier(.32,.72,0,1);max-width:540px;margin:0 auto;max-height:92dvh;overflow-y:auto;box-shadow:0 -8px 40px rgba(60,54,48,.36);}
  .sheet.show{transform:translateY(0);}
  .grab{width:38px;height:5px;border-radius:99px;background:rgba(255,255,255,.3);margin:8px auto 16px;}
  .sheet h3{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:21px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em;}
  .sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:7px;font-weight:500;}
  .field input,.field select,.field textarea{width:100%;background:var(--glass-soft);border:1px solid var(--line);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;padding:14px 14px;border-radius:14px;outline:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,background .2s;resize:none;}
  .field input::placeholder,.field textarea::placeholder{color:var(--muted2);opacity:.6;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--glass);}
  .field select option{background:#3c372f;color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;background:var(--glass-soft);border:1px solid var(--line);color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:13.5px;padding:12px;border-radius:13px;cursor:pointer;transition:all .2s;}
  .seg button.act-in{background:var(--accent-dim);border-color:var(--accent);color:var(--ink);}
  .seg button.act-out{background:rgba(242,166,173,.22);border-color:var(--danger);color:var(--ink);}
  .save{width:100%;background:var(--accent);color:var(--accent-ink);border:none;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:15.5px;padding:16px;border-radius:15px;margin-top:6px;cursor:pointer;transition:opacity .15s,transform .12s;box-shadow:0 6px 20px rgba(52,199,89,.32);}
  .save:active{opacity:.9;transform:scale(.99);}
  .hintline{font-size:11px;color:var(--muted2);margin-top:-8px;margin-bottom:14px;line-height:1.45;}

const KEY='hagestraat_v2';
let S=load();
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):defaultState();}catch(e){return defaultState();}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function euroPlain(n){const neg=n<0;n=Math.abs(Math.round(n));return (neg?'−€':'€')+n.toLocaleString('nl-NL');}
function euro(n){return '<span class="amt">'+euroPlain(n)+'</span>';}
function uid(){return 'x'+Date.now()+Math.floor(Math.random()*999);}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthFromDate(iso){ if(!iso)return null; const mm=parseInt(iso.slice(5,7),10); return MONTHS[mm-1]||null; }
function fmtDate(iso){ if(!iso)return ''; const p=iso.split('-'); if(p.length!==3)return iso; return parseInt(p[2],10)+' '+MFULL[MONTHS[parseInt(p[1],10)-1]]; }
// zet betaalmaand op basis van datum (of verwijder override als gelijk aan projectmaand)
function applyDateMonth(p,it){ const m=monthFromDate(it.date); if(m){ if(m!==p.month) it.month=m; else delete it.month; } }

function incomeForMonth(m){
  let t=0;
  for(const r of S.income){
    if(r.recurring){ t += (r.months&&r.months[m]!=null)?r.months[m]:r.amount; }
    else if(r.byMonth&&r.byMonth[m]!=null){ t+=r.byMonth[m]; }
  }
  return t;
}
// een vaste last heeft een basis-bedrag (amount) en optioneel per-maand uitzonderingen (overrides[maand])
function fixedAmount(f,m){ return (f.overrides && f.overrides[m]!=null) ? +f.overrides[m] : (+f.amount||0); }
function fixedTotal(m){ return S.fixed.reduce((s,f)=>s+fixedAmount(f,m),0); }
function overForMonth(m){ return incomeForMonth(m) - fixedTotal(m); }
function itemCost(it){ return (it.actual!=null && it.actual!=='') ? +it.actual : (+it.budget||0); }
function itemMonth(p,it){ return it.month || p.month; }
function projectCostsForMonth(m){
  let t=0;
  for(const p of S.projects){ for(const it of p.items){ if(itemMonth(p,it)===m) t+=itemCost(it); } }
  return t;
}
function projectTotals(p){ let b=0,a=0; for(const it of p.items){ b+=(+it.budget||0); a+=itemCost(it);} return {budget:b,actual:a}; }
function buildModel(){
  let bal=+S.start; const rows=[];
  for(const m of MONTHS){
    const begin=bal; const inleg=overForMonth(m); const proj=projectCostsForMonth(m);
    bal=begin+inleg-proj; rows.push({m,begin,inleg,proj,end:bal});
  }
  return rows;
}

function projectChipsForMonth(m){
  // bedrag per project dat in deze maand valt, gesorteerd op grootte
  const tally={};
  for(const p of S.projects){
    for(const it of p.items){
      if(itemMonth(p,it)===m){ tally[p.name]=(tally[p.name]||0)+itemCost(it); }
    }
  }
  const names=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]);
  if(!names.length) return '';
  const peak=names[0];
  const chips=names.map(n=>`<span class="pchip ${n===peak?'pchip-main':''}">${escapeHtml(n)}</span>`).join('');
  return `<div class="mchips">${chips}</div>`;
}
function projectLinesForMonth(m){
  // groepeer per project: één regel met het projecttotaal voor deze maand
  const groups=[];
  for(const p of S.projects){
    let total=0, count=0, paidCount=0, actualCount=0;
    for(const it of p.items){
      if(itemMonth(p,it)===m){
        total+=itemCost(it); count++;
        if(it.paid) paidCount++;
        if(it.actual!=null&&it.actual!=='') actualCount++;
      }
    }
    if(count>0) groups.push({name:p.name,total,count,paidCount,actualCount});
  }
  if(!groups.length) return '<div class="dsub" style="margin-top:8px">Geen projectkosten deze maand</div>';
  groups.sort((a,b)=>b.total-a.total);
  const lines=groups.map(g=>{
    // statusbolletje: groen=alles betaald, half=deels, leeg=nog niks
    const dot = g.paidCount===g.count ? '<span class="pdot done"></span>'
              : (g.paidCount>0 ? '<span class="pdot some"></span>' : '<span class="pdot"></span>');
    const sub = g.count>1 ? `<span class="pcount">${g.count}×</span>` : '';
    return `<div class="dline"><span class="l">${dot}${escapeHtml(g.name)} ${sub}</span><span class="r" style="color:var(--danger)">${euro(-g.total)}</span></div>`;
  }).join('');
  return '<div class="dsub" style="margin-top:8px">Projectkosten</div>'+lines;
}

const MON_SHORT=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function pd(iso){ const p=(iso||'').split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso,n){ const d=pd(iso); d.setDate(d.getDate()+n); return toISO(d); }
function daysBetween(a,b){ return Math.round((pd(b)-pd(a))/DAY); }
function mondayOf(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
function fmtShort(iso){ const d=pd(iso); return d.getDate()+' '+MON_SHORT[d.getMonth()]; }
function fmtLong(iso){ const d=pd(iso); return DOW[d.getDay()]+' '+d.getDate()+' '+MON_SHORT[d.getMonth()]; }
function fmtRange(s,e){ if(s===e) return fmtLong(s); return fmtShort(s)+' – '+fmtShort(e); }

function ensurePlan(){ if(!S.plan){ S.plan=defaultState().plan; persist(); }
  // migratie van oude 'wk' data
  S.plan.forEach(t=>{ if(!t.start){ t.start='2026-06-08'; t.end='2026-06-08'; } if(!t.end) t.end=t.start; if(!t.phase) t.phase='A'; });
  if(!S.phaseNames) S.phaseNames=Object.assign({},DEFAULT_PHASE_NAMES);
  if(!S.phaseOrder) S.phaseOrder=DEFAULT_PHASE_ORDER.slice();
  // zorg dat elke gebruikte fase ook in de volgorde staat
  S.plan.forEach(t=>{ if(t.phase && S.phaseOrder.indexOf(t.phase)<0) S.phaseOrder.push(t.phase); });
}
function planVisible(){ ensurePlan(); return S.plan.filter(t=> planFilter==='all' || t.owner===planFilter ); }
function planVisibleOwner(t){ return planFilter==='all' || t.owner===planFilter; }

// laatste einddatum van een groep taken (voor mijlpaal-tellers)
function groupEnd(pred){ const ts=S.plan.filter(pred); if(!ts.length) return null;
  return ts.reduce((m,t)=>t.end>m?t.end:m, ts[0].end); }

function renderPlan(){
  ensurePlan();
  renderIntrekBadge();
  // ---- filters ----
  const fil=document.getElementById('planFilters');
  const fbtn=(id,label,color)=>`<button data-f="${id}" class="${planFilter===id?'active':''}">${color?`<span class="dot" style="background:${color}"></span>`:''}${label}</button>`;
  fil.innerHTML=fbtn('all','Alles')
    +fbtn('jasper','Jasper',OWNERS.jasper.c)+fbtn('mats','Mats',OWNERS.mats.c)
    +fbtn('jij','Jij',OWNERS.jij.c)+fbtn('gedeeld','Anders',OWNERS.gedeeld.c);
  fil.querySelectorAll('button').forEach(b=>b.onclick=()=>{planFilter=b.dataset.f;renderPlan();});

  // ---- mode toggle ----
  document.querySelectorAll('#planMode button').forEach(b=>{
    b.classList.toggle('active',b.dataset.m===planMode);
    b.onclick=()=>{ if(b.dataset.m!==planMode){ ganttScrollLeft=null; } planMode=b.dataset.m;renderPlan();};
  });

  if(planMode==='gantt') renderGantt();
  else renderPlanList();
}

// ===== GANTT (alleen kijken) =====
function renderGantt(){
  const vis=planVisible().slice().sort((a,b)=> a.start===b.start ? daysBetween(b.start,b.end)-daysBetween(a.start,a.end) : (a.start<b.start?-1:1));
  const body=document.getElementById('planBody');
  if(!vis.length){ body.innerHTML=`<div class="intro" style="text-align:center">Niets in deze filter.</div>`; return; }

  let maxISO=vis.reduce((m,t)=>t.end>m?t.end:m,vis[0].end);
  if(INTREK_ISO>maxISO) maxISO=INTREK_ISO;
  // venster: ma week 23 (1 jun 2026) t/m zo week 33 (16 aug 2026)
  const WK23_MON='2026-06-01', WK33_SUN='2026-08-16';
  let startMon=mondayOf(pd(WK23_MON));
  let lastSun=pd(WK33_SUN);
  // als een taak verder loopt, rek mee
  const endD=pd(maxISO); const es=mondayOf(endD); es.setDate(es.getDate()+6);
  if(es>lastSun) lastSun=es;
  const totalDays=Math.round((lastSun-startMon)/DAY)+1;
  const weeks=Math.ceil(totalDays/7);
  const COLW=ganttColW; const dayPx=COLW/7;
  const PADL=20; // extra ruimte links binnen de track
  const trackW=totalDays*dayPx+PADL;
  const LABELW=120;

  const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  let wh='', nowWeekLeft=null;
  for(let w=0;w<weeks;w++){
    const wkStart=new Date(startMon); wkStart.setDate(wkStart.getDate()+w*7);
    const wkEnd=new Date(wkStart); wkEnd.setDate(wkEnd.getDate()+6);
    const isNow=(todayMid>=wkStart && todayMid<=wkEnd);
    if(isNow) nowWeekLeft=PADL+w*7*dayPx;
    const sameMonth=wkStart.getMonth()===wkEnd.getMonth();
    const dates = sameMonth ? `${wkStart.getDate()}–${wkEnd.getDate()} ${MON_SHORT[wkStart.getMonth()]}`
                            : `${wkStart.getDate()} ${MON_SHORT[wkStart.getMonth()]}–${wkEnd.getDate()} ${MON_SHORT[wkEnd.getMonth()]}`;
    wh+=`<div class="gh-week ${isNow?'now':''}" style="width:${COLW}px${w===0?';margin-left:'+PADL+'px':''}">
      <div class="gw-no">wk ${isoWeek(wkStart)}</div>
      <div class="gw-dates">${dates}</div>
    </div>`;
  }
  const nowBand = nowWeekLeft!=null ? `<div class="gantt-nowweek" style="left:${LABELW+nowWeekLeft}px;width:${COLW}px"></div>` : '';
  const todayOff=PADL + Math.max(0,Math.round((todayMid-startMon)/DAY))*dayPx + dayPx/2;
  // weekrasterlijnen exact op de header-grenzen (PADL + w*COLW)
  let gridLines='';
  for(let w=0;w<=weeks;w++){ gridLines+=`<i style="left:${LABELW+PADL+w*COLW}px"></i>`; }

  let rows='';
  for(const t of vis){
    const o=OWNERS[t.owner]||OWNERS.jij;
    const offStart=daysBetween(toISO(startMon),t.start);
    const dur=Math.max(0,daysBetween(t.start,t.end))+1;
    const left=PADL+offStart*dayPx;
    const sc=t.status==='done'?'s-done':t.status==='busy'?'s-busy':'';
    let barHtml;
    if(t.milestone){
      const cx=left + (dur*dayPx)/2;
      const flagLeft = cx > trackW-90;
      barHtml=`<div class="gms ${sc}" style="left:${cx}px">${t.status==='done'?'<span class="gms-check">✓</span>':''}</div>
        <div class="gms-flag" style="${flagLeft?`right:${trackW-cx+16}px`:`left:${cx+16}px`}">${escapeHtml(shortTitle(t.title))}</div>`;
    } else {
      const w=Math.max(dur*dayPx,22);
      const wide = w>=64;
      const labelHtml = wide ? `<span class="gb-txt in">${escapeHtml(shortTitle(t.title))}</span>` : '';
      barHtml=`<div class="gbar ${sc}" style="left:${left}px;width:${w}px;--bar-c:${o.bar};--bar-bd:${o.bd}">
        <span class="gb-check">${t.status==='done'?'✓':t.status==='busy'?'●':''}</span>
        ${labelHtml}
      </div>`;
    }
    rows+=`<div class="grow ${t.status==='done'?'done':''} ${t.milestone?'is-ms':''}">
      <div class="g-label">
        <div class="gl-t">${t.milestone?'<span class="ms-dot">◆</span> ':''}${escapeHtml(shortTitle(t.title))}</div>
        <div class="gl-d"><span class="dot" style="background:${o.c}"></span>${fmtRange(t.start,t.end)}</div>
      </div>
      <div class="g-track">${barHtml}</div>
    </div>`;
  }

  body.innerHTML=`<div class="gantt" style="--labelw:${LABELW}px">
    <div class="gantt-headwrap" id="ganttHeadWrap">
      <div class="gh-label-fixed">Taak</div>
      <div class="gantt-inner" style="width:${LABELW+trackW}px">
        <div class="gantt-head">
          <div class="gh-label"></div>
          <div class="gh-weeks">${wh}</div>
        </div>
      </div>
    </div>
    <div class="gantt-scroll" id="ganttScroll">
      <div class="gantt-inner" style="width:${LABELW+trackW}px">
        <div class="gantt-rows" style="position:relative">
          <div class="gantt-grid">${gridLines}</div>
          ${nowBand}
          <div class="gantt-today" style="left:${LABELW+todayOff}px"></div>
          ${rows}
        </div>
      </div>
    </div>
    <div class="gantt-hint">◆ = mijlpaal · tik op een taak voor de volledige naam · knijp om te zoomen</div>
  </div>`;

  const scEl=document.getElementById('ganttScroll');
  const hwEl=document.getElementById('ganttHeadWrap');
  // horizontale scroll synchroniseren tussen body en (sticky) header
  if(scEl&&hwEl){
    const hInner=hwEl.querySelector('.gantt-inner');
    const syncHead=()=>{ hInner.style.transform=`translateX(${-scEl.scrollLeft}px)`; };
    scEl.addEventListener('scroll',syncHead,{passive:true});
    if(ganttScrollLeft!=null){ scEl.scrollLeft=ganttScrollLeft; }
    else { scEl.scrollLeft=Math.max(0,todayOff-COLW); }
    syncHead();
  }

  // ---- rij uitklappen: tik op de taaknaam-kolom toont volledige naam ----
  body.querySelectorAll('.grow').forEach(row=>{
    const label=row.querySelector('.g-label');
    if(label) label.addEventListener('click',()=>{ row.classList.toggle('expanded'); });
  });

  // ---- pinch-to-zoom: vingers naar buiten = inzoomen (bredere kolommen) ----
  if(scEl){
    let pinchStart=0, pinchColW=0;
    const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    scEl.addEventListener('touchstart',(e)=>{
      if(e.touches.length===2){ pinchStart=dist(e.touches); pinchColW=ganttColW; }
    },{passive:true});
    scEl.addEventListener('touchmove',(e)=>{
      if(e.touches.length===2 && pinchStart){
        e.preventDefault();
        const ratio=dist(e.touches)/pinchStart;
        const nw=Math.max(GANTT_COLW_MIN,Math.min(GANTT_COLW_MAX, Math.round(pinchColW*ratio)));
        if(Math.abs(nw-ganttColW)>=4){
          ganttColW=nw;
          ganttScrollLeft=scEl.scrollLeft; // behoud positie
          renderGantt();
        }
      }
    },{passive:false});
    scEl.addEventListener('touchend',(e)=>{ if(e.touches.length<2) pinchStart=0; });
  }
}

function shortTitle(t){ return t.replace(/^◆\s*/,''); }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-dn+3);
  const f=new Date(Date.UTC(x.getUTCFullYear(),0,4));
  return 1+Math.round(((x-f)/DAY-3+((f.getUTCDay()+6)%7))/7); }

// ===== LIJST (werkplek: invoeren, slepen, status) =====
function renderPlanList(){
  ensurePlan();
  const body=document.getElementById('planBody');
  let html='';
  for(const pid of phaseOrder()){
    const tasks=S.plan.filter(t=>t.phase===pid && planVisibleOwner(t));
    const tasksAll=S.plan.filter(t=>t.phase===pid);
    const d=tasksAll.filter(t=>t.status==='done').length;
    const ppct=tasksAll.length?Math.round(d/tasksAll.length*100):0;
    html+=`<div class="pl-phase" data-phase="${pid}">
      <div class="pl-phead">
        <button class="pl-pname" data-rename="${pid}">${escapeHtml(phaseName(pid))} <span class="pl-pen">✎</span></button>
        <span class="pl-pmeta">${d}/${tasksAll.length}</span>
      </div>
      <div class="pl-pbar"><i style="width:${ppct}%"></i></div>
      <div class="pl-list" data-plist="${pid}">`;
    for(const t of tasks) html+=planCard(t);
    if(!tasks.length) html+=`<div class="pl-empty">Geen taken${planFilter!=='all'?' voor dit filter':''}</div>`;
    html+=`</div></div>`;
  }
  html+=`<button class="new-proj" id="newPhaseBtn">+ Nieuwe lijst</button>`;
  body.innerHTML=html;

  // status cyclen
  body.querySelectorAll('.pl-status').forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation();
    const t=S.plan.find(x=>x.id===btn.dataset.id); if(!t) return;
    t.status=STATUS_NEXT[t.status]||'open'; persist(); renderPlan();
    toast(t.status==='done'?'Klaar ✓':t.status==='busy'?'Loopt':'Open');
  });
  // mijlpaal toggle (bookmark)
  body.querySelectorAll('.pl-bookmark').forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation();
    const t=S.plan.find(x=>x.id===btn.dataset.id); if(!t) return;
    t.milestone=!t.milestone; persist(); renderPlan();
    toast(t.milestone?'Mijlpaal aan':'Mijlpaal uit');
  });
  // kaart openen (bewerken)
  body.querySelectorAll('.pl-card').forEach(card=>card.onclick=()=>{
    const wrap=card.closest('.pl-swipe'); if(wrap&&wrap._swiped) return;
    const t=S.plan.find(x=>x.id===card.dataset.id); if(t) openPlanSheet(t);
  });
  // fase hernoemen / verwijderen
  body.querySelectorAll('[data-rename]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    openPhaseRename(el.dataset.rename);
  });
  // nieuwe lijst
  document.getElementById('newPhaseBtn').onclick=addPhase;
  // swipe-to-delete op taken
  body.querySelectorAll('.pl-swipe').forEach(makeSwipeDelete);
  // slepen binnen + tussen fases
  phaseOrder().forEach(pid=>{
    const list=body.querySelector(`[data-plist="${pid}"]`);
    if(list) makePlanReorder(list);
  });
}

function makeSwipeDelete(wrap){
  const card=wrap.querySelector('.pl-card');
  const bg=wrap.querySelector('.pl-swipe-bg');
  const id=wrap.dataset.swipe;
  let x0=0,y0=0,dx=0,active=false,decided=false,horiz=false;
  const THRESH=90; // px om te verwijderen
  function down(e){
    if(e.target.closest('.pl-drag')) return; // slepen-handle = herordenen, niet swipen
    const pt=e.touches?e.touches[0]:e;
    x0=pt.clientX; y0=pt.clientY; dx=0; active=true; decided=false; horiz=false;
    card.style.transition='none';
    if(bg) bg.style.transition='none';
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('touchend',up);
  }
  function move(e){
    if(!active) return;
    const pt=e.touches?e.touches[0]:e;
    const ddx=pt.clientX-x0, ddy=pt.clientY-y0;
    if(!decided){
      if(Math.abs(ddx)<6 && Math.abs(ddy)<6) return;
      horiz=Math.abs(ddx)>Math.abs(ddy);
      decided=true;
      if(!horiz){ cleanup(); return; } // verticaal = laat scroll/herorden met rust
    }
    if(horiz){
      if(e.cancelable) e.preventDefault();
      dx=Math.min(0,ddx); // alleen naar links
      card.style.transform=`translateX(${dx}px)`;
      // rode laag faadt mee met de afstand (subtiel)
      if(bg) bg.style.opacity=Math.min(1, -dx/THRESH).toFixed(2);
      wrap.classList.toggle('arming', dx<-THRESH);
    }
  }
  function up(){
    if(!active){ return; }
    cleanup();
    card.style.transition='transform .2s';
    if(bg) bg.style.transition='opacity .15s';
    if(horiz){ wrap._swiped=true; setTimeout(()=>{wrap._swiped=false;},250); }
    if(horiz && dx<-THRESH){
      if(bg) bg.style.opacity='1';
      card.style.transform=`translateX(-110%)`;
      setTimeout(()=>deletePlanTask(id),160);
    } else {
      card.style.transform='translateX(0)';
      if(bg) bg.style.opacity='0';
      wrap.classList.remove('arming');
    }
  }
  function cleanup(){
    active=false;
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('touchmove',move);
    window.removeEventListener('touchend',up);
  }
  wrap.addEventListener('pointerdown',down);
  wrap.addEventListener('touchstart',down,{passive:true});
}

function addPhase(){
  ensurePlan();
  const id='L'+Date.now().toString(36);
  S.phaseOrder.push(id);
  S.phaseNames[id]='Nieuwe lijst';
  persist(); renderPlan();
  openPhaseRename(id);
}

  const o=OWNERS[t.owner]||OWNERS.jij;
  const sm=STATUS_META[t.status]||STATUS_META.open;
  return `<div class="pl-swipe" data-swipe="${t.id}">
    <div class="pl-swipe-bg"><span>Verwijderen</span></div>
    <div class="pl-card ${t.status==='done'?'done':''} ${t.milestone?'is-ms':''}" data-id="${t.id}" data-cardid="${t.id}" style="--oc:${o.c}">
    <button class="pl-bookmark ${t.milestone?'on':''}" data-id="${t.id}" title="Markeer als mijlpaal" aria-label="Mijlpaal">
      <svg viewBox="0 0 24 24" width="15" height="20" aria-hidden="true"><path d="M5 2h14a1 1 0 0 1 1 1v18l-8-5-8 5V3a1 1 0 0 1 1-1z"/></svg>
    </button>
    <span class="drag-h pl-drag" title="Sleep om te ordenen">⠿</span>
    <div class="pl-main">
      <div class="pl-name">${escapeHtml(shortTitle(t.title))}</div>
      <div class="pl-owner"><span class="dot" style="background:${o.c}"></span>${o.label}</div>
      <div class="pl-dates">${fmtRange(t.start,t.end)}${t.milestone?'<span class="pl-ms-tag">mijlpaal</span>':''}</div>
    </div>
    <button class="pl-status st-${t.status}" data-id="${t.id}" style="--sc:${sm.c};--sbg:${sm.bg}">${sm.l}</button>
    </div>
  </div>`;
}

function deletePlanTask(id){
  removeWithUndo('Taak verwijderd',
    ()=>S.plan,
    (snap)=>{ S.plan=snap; },
    ()=>{ S.plan=S.plan.filter(x=>x.id!==id); }
  );
}

function makePlanReorder(list){
  list.querySelectorAll('.pl-card').forEach(card=>{
    const handle=card.querySelector('.pl-drag');
    if(!handle) return;
    handle.addEventListener('click',e=>e.stopPropagation());
    handle.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const bodyEl=document.getElementById('planBody');
      const startY=e.clientY; let moved=false;
      const rect=card.getBoundingClientRect();
      card.classList.add('pl-dragging');
      card.style.width=rect.width+'px';
      // drop-indicator element
      const dl=document.createElement('div'); dl.className='pl-dropline';
      function clearMarks(){
        if(dl.parentNode) dl.parentNode.removeChild(dl);
        bodyEl.querySelectorAll('.pl-list.drop-target').forEach(l=>l.classList.remove('drop-target'));
      }
      function mv(ev){
        const y=ev.clientY;
        if(Math.abs(y-startY)>4) moved=true;
        if(!moved) return;
        card.style.transform=`translateY(${y-startY}px)`;
        const allCards=Array.from(bodyEl.querySelectorAll('.pl-card')).filter(c=>c!==card);
        let target=null;
        for(const c of allCards){ const r=c.getBoundingClientRect();
          if(ev.clientY>=r.top && ev.clientY<=r.bottom){ target=c; break; } }
        const lists=Array.from(bodyEl.querySelectorAll('.pl-list'));
        let targetList=null;
        for(const l of lists){ const r=l.getBoundingClientRect();
          if(ev.clientY>=r.top-6 && ev.clientY<=r.bottom+6){ targetList=l; } }
        clearMarks();
        if(targetList) targetList.classList.add('drop-target');
        if(target){
          const r=target.getBoundingClientRect();
          const after=ev.clientY>(r.top+r.height/2);
          card.dataset._pending=target.dataset.cardid+'|'+(after?'after':'before');
          const tw=target.closest('.pl-swipe')||target;
          tw.parentNode.insertBefore(dl, after?tw.nextSibling:tw);
        } else if(targetList){
          card.dataset._pending=targetList.dataset.plist+'|end';
          targetList.appendChild(dl);
        }
      }
      function up(){
        window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
        card.classList.remove('pl-dragging'); card.style.transform=''; card.style.width='';
        const pend=card.dataset._pending; delete card.dataset._pending;
        clearMarks();
        if(moved && pend){ applyPlanDrop(card.dataset.cardid, pend); }
      }
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
    });
  });
}

function applyPlanDrop(dragId, pend){
  const [ref,pos]=pend.split('|');
  const dragT=S.plan.find(t=>t.id===dragId); if(!dragT) return;
  // verwijder uit array
  S.plan=S.plan.filter(t=>t.id!==dragId);
  if(pos==='end'){
    dragT.phase=ref; // ref is phase id
    // achteraan die fase plaatsen: vind laatste index van die fase
    let lastIdx=-1;
    S.plan.forEach((t,i)=>{ if(t.phase===ref) lastIdx=i; });
    S.plan.splice(lastIdx+1,0,dragT);
  } else {
    const refT=S.plan.find(t=>t.id===ref);
    if(refT){ dragT.phase=refT.phase;
      let idx=S.plan.indexOf(refT); if(pos==='after') idx++;
      S.plan.splice(idx,0,dragT);
    } else { S.plan.push(dragT); }
  }
  persist(); renderPlan(); toast('Verplaatst ✓');
}

function openPhaseRename(pid){
  document.getElementById('sheetTitle').textContent='Lijst hernoemen';
  document.getElementById('sheetTitle').style.display='';document.getElementById('sheetSub').style.display='';
  document.getElementById('sheetSub').textContent=phaseName(pid);
  const taskCount=S.plan.filter(t=>t.phase===pid).length;
  document.getElementById('formArea').innerHTML=`
    <div class="field"><label>Naam van deze lijst</label><input id="phName" value="${escapeHtml(phaseName(pid))}"></div>
    <button class="save" id="phSave">Opslaan</button>
    <button class="del-btn" id="phDelete">Lijst verwijderen${taskCount?` (${taskCount} ${taskCount===1?'taak':'taken'} ook)`:''}</button>`;
  const inp=document.getElementById('phName');
  document.getElementById('phSave').onclick=()=>{
    const nv=inp.value.trim(); if(nv){ S.phaseNames[pid]=nv; persist(); renderPlan(); }
    closeSheets(); toast('Lijst hernoemd ✓');
  };
  document.getElementById('phDelete').onclick=()=>{
    if(phaseOrder().length<=1){ alert('Er moet minstens één lijst blijven.'); return; }
    const msg=taskCount?`Deze lijst en de ${taskCount} ${taskCount===1?'taak':'taken'} erin verwijderen?`:'Deze lege lijst verwijderen?';
    if(confirm(msg)){
      S.plan=S.plan.filter(t=>t.phase!==pid);
      S.phaseOrder=S.phaseOrder.filter(x=>x!==pid);
      delete S.phaseNames[pid];
      persist(); renderPlan(); closeSheets(); toast('Lijst verwijderd');
    }

function openPlanSheet(t){
  const st=document.getElementById('sheetTitle'), su=document.getElementById('sheetSub');
  st.style.display='none'; su.style.display='none';
  const ownBtn=(k)=>`<button data-o="${k}" class="own-btn ${t.owner===k?'active':''}" style="--oc:${OWNERS[k].c}"><span class="dot" style="background:${OWNERS[k].c}"></span>${OWNERS[k].label}</button>`;
  document.getElementById('formArea').innerHTML=`
    <div class="field" style="margin-top:6px"><label>Naam</label><input id="planTitle" value="${escapeHtml(shortTitle(t.title))}"></div>
    <div class="field"><label>Wie doet dit?</label><div class="own-row">${ownBtn('jasper')}${ownBtn('mats')}${ownBtn('jij')}${ownBtn('gedeeld')}</div></div>
    <div class="field"><label>Wanneer</label>
      <div class="cal" id="planCal"></div>
      <div class="cal-sum" id="calSum"></div>
    </div>
    <div class="field" style="margin-top:14px"><label>Notitie</label><textarea id="planMine" rows="2" placeholder="Afspraak, contactpersoon, telefoonnummer…">${escapeHtml(t.mine||t.note||'')}</textarea></div>
    <button class="save" id="planSave">Opslaan</button>
    <button class="del-btn" id="planDelete">Verwijderen</button>`;
  let chosenOwner=t.owner;
  document.querySelectorAll('#formArea .own-btn').forEach(b=>b.onclick=()=>{
    chosenOwner=b.dataset.o;
    document.querySelectorAll('#formArea .own-btn').forEach(x=>x.classList.toggle('active',x.dataset.o===chosenOwner));
  });
  // --- kalender-state ---
  let selStart=t.start, selEnd=t.end||t.start;
  let pick=0; // 0 = volgende tik zet begin; 1 = volgende tik zet eind
  let viewM=pd(selStart).getMonth(), viewY=pd(selStart).getFullYear();
  const calEl=document.getElementById('planCal'), sumEl=document.getElementById('calSum');
  function drawCal(){
    const first=new Date(viewY,viewM,1);
    const offset=(first.getDay()+6)%7; // ma=0
    const dim=new Date(viewY,viewM+1,0).getDate();
    let cells='';
    for(let i=0;i<offset;i++) cells+=`<span class="cd empty"></span>`;
    for(let d=1;d<=dim;d++){
      const iso=toISO(new Date(viewY,viewM,d));
      const inRange = iso>=selStart && iso<=selEnd;
      const isStart = iso===selStart, isEnd = iso===selEnd;
      let cls='cd';
      if(inRange) cls+=' in';
      if(isStart) cls+=' start';
      if(isEnd) cls+=' end';
      if(isStart&&isEnd) cls+=' single';
      cells+=`<button class="${cls}" data-iso="${iso}">${d}</button>`;
    }
    calEl.innerHTML=`
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="Vorige maand">‹</button>
        <span class="cal-title">${MFULL[MONTHS[viewM]]} ${viewY}</span>
        <button class="cal-nav" id="calNext" aria-label="Volgende maand">›</button>
      </div>
      <div class="cal-dow"><span>M</span><span>D</span><span>W</span><span>D</span><span>V</span><span>Z</span><span>Z</span></div>
      <div class="cal-grid">${cells}</div>`;
    document.getElementById('calPrev').onclick=()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} drawCal(); };
    document.getElementById('calNext').onclick=()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} drawCal(); };
    calEl.querySelectorAll('.cd[data-iso]').forEach(b=>b.onclick=()=>{
      const iso=b.dataset.iso;
      if(pick===0){ selStart=iso; selEnd=iso; pick=1; }
      else { if(iso<selStart){ selEnd=selStart; selStart=iso; } else { selEnd=iso; } pick=0; }
      drawCal(); updateSum();
    });
  }
  function updateSum(){
    sumEl.textContent = selStart===selEnd
      ? `Eén dag · ${fmtLong(selStart)}`
      : `${fmtLong(selStart)} → ${fmtLong(selEnd)}`;
  }
  drawCal(); updateSum();
  document.getElementById('planSave').onclick=()=>{
    const nt=document.getElementById('planTitle').value.trim(); if(nt) t.title=nt;
    t.start=selStart; t.end=selEnd<selStart?selStart:selEnd;
    t.owner=chosenOwner;
    t.mine=document.getElementById('planMine').value.trim(); delete t.note;
    persist();renderPlan();closeSheets();toast('Opgeslagen ✓');
  };
  document.getElementById('planDelete').onclick=()=>{
    closeSheets();
    deletePlanTask(t.id);
  };
  scrim.classList.add('show');sheet.classList.add('show');
}

// Maakt rijen binnen een container sleepbaar (touch + muis) via een handle.
// rowSel: selector van de sleepbare rijen; idAttr: data-attribuut met de id.
// onReorder(newIdOrder) krijgt de nieuwe volgorde van id's terug.
function makeReorderable(container, rowSel, idAttr, onReorder, handleSel){
  handleSel=handleSel||'.drag-h';
  container.querySelectorAll(rowSel).forEach(row=>{
    const handle=row.querySelector(handleSel);
    if(!handle) return;
    let rows=[], startY=0, startTop=0, lastY=0, dropLine=null, moved=false;

    handle.addEventListener('click', e=>{ e.stopPropagation(); });
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      rows=Array.from(container.querySelectorAll(rowSel));
      startY=e.clientY; lastY=e.clientY; moved=false;
      const r=row.getBoundingClientRect();
      startTop=r.top;
      // licht de rij op: zweeft mee, blijft op zijn plek tot je beweegt
      row.classList.add('dragging');
      row.style.zIndex='50';
      row.style.position='relative';
      // drop-lijn die de landplek toont
      dropLine=document.createElement('div');
      dropLine.className='drop-line';
      handle.setPointerCapture(e.pointerId);
    });

    handle.addEventListener('pointermove', e=>{
      if(!rows.length) return;
      e.preventDefault();
      const dy=e.clientY-startY;
      if(Math.abs(dy)>3) moved=true;
      lastY=e.clientY;
      // de rij beweegt mee onder de vinger
      row.style.transform=`translateY(${dy}px) scale(1.02)`;
      // bepaal landplek: rij waarvan het midden het dichtst bij de vinger ligt
      const y=e.clientY;
      let target=null, after=false;
      for(const r of rows){
        if(r===row) continue;
        const b=r.getBoundingClientRect();
        if(y>=b.top-4 && y<=b.bottom+4){
          target=r; after = y > b.top + b.height/2; break;
        }
      }
      if(target){
        if(after){ target.after(dropLine); } else { target.before(dropLine); }
      } else if(rows.length){
        const first=rows.find(r=>r!==row), last=[...rows].reverse().find(r=>r!==row);
        if(first && y < first.getBoundingClientRect().top){ first.before(dropLine); }
        else if(last){ last.after(dropLine); }
      }
    });

    const finish=e=>{
      if(!rows.length) return;
      // plaats de rij op de positie van de drop-lijn
      if(dropLine && dropLine.parentNode){ dropLine.parentNode.insertBefore(row, dropLine); dropLine.remove(); }
      row.classList.remove('dragging');
      row.style.transform=''; row.style.zIndex=''; row.style.position=''; 
      try{handle.releasePointerCapture(e.pointerId);}catch(_){}
      const wasMoved=moved;
      rows=[]; dropLine=null;
      if(wasMoved){
        const newOrder=Array.from(container.querySelectorAll(rowSel)).map(r=>r.getAttribute(idAttr));
        onReorder(newOrder);
      }
    };
    handle.addEventListener('pointerup', finish);
    handle.addEventListener('pointercancel', finish);
  });
}
// herschik een array: alleen de zichtbare id's (idOrder) worden onderling herordend,
// items die niet in idOrder zitten behouden hun relatieve plek.
function reorderArrayById(arr, idOrder, idKey){
  const visibleSet=new Set(idOrder);
  const byId={}; arr.forEach(o=>byId[o[idKey]]=o);
  const reordered=idOrder.map(id=>byId[id]).filter(Boolean);
  let vi=0;
  return arr.map(o=> visibleSet.has(o[idKey]) ? reordered[vi++] : o );
}

    <div class="hintline" id="efHint"></div>
    ${hasOverride?`<div class="footlink" style="margin:2px 0 14px"><a id="efClear">↺ Uitzondering voor ${m} verwijderen</a></div>`:''}
    <button class="save" id="efSave">Opslaan</button>`;
  const setScope=s=>{
    editFixState.scope=s;
    document.getElementById('efAll').className=s==='all'?'act-in':'';
    document.getElementById('efThis').className=s==='this'?'act-out':'';
    document.getElementById('efHint').textContent = s==='all'
      ? 'Past het standaardbedrag aan voor elke maand (behalve maanden met een eigen uitzondering).'
      : 'Alleen '+MFULL[m]+' wijkt af; de andere maanden blijven '+euro(+f.amount||0)+'.';
  };
  document.getElementById('efAll').onclick=()=>setScope('all');
  document.getElementById('efThis').onclick=()=>setScope('this');
  setScope(editFixState.scope);
  const clr=document.getElementById('efClear');
  if(clr) clr.onclick=()=>{ if(f.overrides){delete f.overrides[m];} persist();renderAll();closeSheets();toast('Uitzondering verwijderd'); };
  document.getElementById('efSave').onclick=()=>{
    const v=parseFloat(document.getElementById('efAmt').value);
    if(isNaN(v)||v<0){toast('Vul een bedrag in');return;}
    const nm=document.getElementById('efName').value.trim();
    if(nm) f.name=nm;
    if(editFixState.scope==='all'){ f.amount=v; }
    else { if(!f.overrides)f.overrides={}; f.overrides[m]=v; }
    persist();renderAll();closeSheets();toast('Aangepast ✓');
  };
  scrim.classList.add('show');sheet.classList.add('show');
}

document.getElementById('newProjBtn').onclick=()=>{
  document.getElementById('sheetTitle').textContent='Nieuw project';
  document.getElementById('sheetTitle').style.display='';document.getElementById('sheetSub').style.display='';
  document.getElementById('sheetSub').textContent='Groepeer kosten onder een noemer.';
  document.getElementById('formArea').innerHTML=`
    <div class="field"><label>Projectnaam</label><input type="text" id="npName" placeholder="bijv. Tuin"></div>
    <div class="field"><label>Standaard betaalmaand</label><select id="npMonth">${monthOpts(CURRENT_MONTH)}</select></div>
    <button class="save" id="npSave">Project aanmaken</button>`;
  document.getElementById('npSave').onclick=()=>{
    const name=document.getElementById('npName').value.trim()||'Nieuw project';
    const month=document.getElementById('npMonth').value;
    S.projects.push({id:uid(),name,month,items:[]});
    persist();renderAll();closeSheets();toast('Project aangemaakt ✓');
  };
  scrim.classList.add('show');sheet.classList.add('show');
};

document.getElementById('openSettings').onclick=()=>{
  document.getElementById('setStart').value=S.start;
  document.getElementById('setBuffer').value=S.buffer;
  scrim.classList.add('show');setSheet.classList.add('show');
};
document.getElementById('setSave').onclick=()=>{
  S.start=parseFloat(document.getElementById('setStart').value)||0;
  S.buffer=parseFloat(document.getElementById('setBuffer').value)||0;
  persist();renderAll();closeSheets();toast('Bewaard ✓');
};

// ---- Back-up: exporteren naar een bestandje ----
document.getElementById('exportBtn').onclick=()=>{
  try{
    const data=JSON.stringify(S,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.href=url; a.download='hagestraat-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Back-up gedownload ✓');
  }catch(e){ toast('Back-up mislukt'); }
};

// ---- Back-up terugzetten: importeren uit een bestandje ----
document.getElementById('importBtn').onclick=()=>{ document.getElementById('importFile').click(); };
document.getElementById('importFile').onchange=(ev)=>{
  const file=ev.target.files&&ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      // simpele check of het een geldig back-upbestand is
      if(!obj || typeof obj!=='object' || !('projects' in obj) || !('income' in obj)){
        toast('Geen geldig back-upbestand'); return;
      }
      if(confirm('Back-up terugzetten? Je huidige gegevens worden vervangen.')){
        S=obj; persist(); renderAll(); toast('Back-up teruggezet ✓');
      }
    }catch(e){ toast('Bestand kon niet gelezen worden'); }
    ev.target.value=''; // reset zodat hetzelfde bestand opnieuw kan
  };
  reader.readAsText(file);
};

let toastT;
function toast(m, undoFn){
  const t=document.getElementById('toast');
  clearTimeout(toastT);
  t.innerHTML = `<span class="tmsg">${m}</span>` + (undoFn?`<button class="undo-btn" id="undoBtn">Ongedaan maken</button>`:'');
  t.classList.add('show');
  if(undoFn){
    document.getElementById('undoBtn').onclick=()=>{ undoFn(); clearTimeout(toastT); t.classList.remove('show'); };
    toastT=setTimeout(()=>t.classList.remove('show'),5000); // langer zichtbaar bij undo
  } else {
    toastT=setTimeout(()=>t.classList.remove('show'),1500);
  }
}
// verwijder met mogelijkheid tot terugdraaien.
// getArr/setArr verwijzen naar de array; doRemove voert de verwijdering uit.
function removeWithUndo(msg, getArr, setArr, doRemove){
  const snapshot=JSON.parse(JSON.stringify(getArr())); // staat VÓÓR verwijderen
  doRemove();
  persist();renderAll();
  toast(msg, ()=>{ setArr(snapshot); persist();renderAll();toast('Teruggezet ✓'); });
}

renderAll();
</script>
</body>
</html>
