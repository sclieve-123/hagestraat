<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1c17">
<title>Hagestraat · Vermogensmodel</title>
<style>
  /* Apple-style system font stack, no web fonts */
  :root{
    /* warm dark taupe glass palette (better contrast) */
    --bg:#312d29;
    --bg-grad-a:#403a34; --bg-grad-b:#2e2a26; --bg-grad-c:#24211d;
    --glass:rgba(255,255,255,.09);
    --glass-strong:rgba(255,255,255,.15);
    --glass-soft:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.16);
    --line2:rgba(255,255,255,.10);
    --ink:#fcfbf9;
    --muted:#d9d4cc;
    --muted2:#a9a298;
    --accent:#5fd07a;          /* iOS green */
    --accent-solid:#34c759;
    --accent-ink:#0f2a16;
    --accent-dim:rgba(95,208,122,.22);
    --warn:#f3c98b;
    --danger:#f2a6ad;
    --gold:#f0d9a0;
    --radius:20px; --safe-bottom:env(safe-area-inset-bottom,0px);
    --shadow:0 8px 30px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100dvh;padding-bottom:calc(86px + var(--safe-bottom));overflow-x:hidden;
    background:
      radial-gradient(1100px 700px at 85% -5%, var(--bg-grad-a), transparent 60%),
      radial-gradient(900px 600px at -10% 30%, var(--bg-grad-b), transparent 55%),
      linear-gradient(170deg, var(--bg-grad-b), var(--bg-grad-c));
    background-attachment:fixed;}
  .wrap{max-width:540px;margin:0 auto;padding:0 14px;}
  header{padding:28px 0 10px;}
  .eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted2);font-weight:600;}
  h1{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:26px;margin-top:3px;letter-spacing:-.02em;color:var(--ink);}

  .tabs{display:flex;gap:5px;margin:18px 0 16px;background:var(--glass-soft);padding:5px;border-radius:16px;border:1px solid var(--line2);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);}
  .tabs button{flex:1;background:transparent;border:none;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;padding:11px 4px;border-radius:12px;cursor:pointer;transition:all .2s;}
  .tabs button.active{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(60,54,48,.20);}

  .view{display:none;animation:fade .3s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .intro{font-size:12.5px;color:var(--muted);line-height:1.55;margin:14px 4px 14px;}

  /* glass card base */
  .card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:11px;
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);}

  .mrow{padding:15px 17px;cursor:pointer;position:relative;transition:background .2s;}
  .mrow::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-dim);}
  .mrow.low::before{background:rgba(243,201,139,.5);}
  .mrow.neg::before{background:rgba(242,166,173,.6);}
  .mrow.past{opacity:.55;}
  /* current month highlight */
  .mrow-wrap.now-wrap{border-color:rgba(95,208,122,.55);box-shadow:0 0 0 1px rgba(95,208,122,.35), var(--shadow);}
  .mrow.now{background:linear-gradient(100deg,rgba(95,208,122,.16),rgba(95,208,122,.05));}
  .mrow.now::before{background:var(--accent-solid);}
  .mrow.now .now-badge{font-size:8.5px;letter-spacing:.12em;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:middle;}
  .mtop{display:flex;justify-content:space-between;align-items:baseline;}
  .mtitle{font-weight:600;font-size:16px;}
  .mtitle .yr{color:var(--muted2);font-weight:400;font-size:11px;margin-left:5px;}
  .mend{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .mend.low{color:var(--warn);} .mend.neg{color:var(--danger);}
  .mflow{display:flex;gap:7px;margin-top:10px;font-size:11.5px;flex-wrap:wrap;}
  .mchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
  .mchips .pchip{font-size:10px;font-weight:500;color:var(--muted2);background:var(--glass-soft);border:1px solid var(--line2);padding:3px 9px;border-radius:999px;letter-spacing:.01em;}
  .mchips .pchip-main{color:var(--accent);background:var(--accent-dim);border-color:transparent;font-weight:600;}
  .past-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--glass-soft);border:1px solid var(--line2);color:var(--muted);font-size:12.5px;font-weight:600;padding:11px;border-radius:14px;margin-bottom:10px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:color .15s;}
  .past-toggle:active{color:var(--ink);}
  .past-toggle .chev{font-size:11px;transition:transform .25s;}
  .past-toggle.open .chev{transform:rotate(180deg);}
  .past-group{display:none;}
  .past-group.show{display:block;animation:fade .25s ease;}
  .pill{background:var(--glass-soft);border:1px solid var(--line2);padding:4px 10px;border-radius:999px;color:var(--muted2);}
  .pill b{font-weight:600;}
  .pill.in b{color:var(--accent);} .pill.out b{color:var(--danger);} .pill.begin b{color:var(--ink);}
  .mdetail{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--glass-soft);}
  .mrow-wrap.open .mdetail{max-height:900px;}
  .mrow-wrap.open .mrow{background:var(--glass-soft);}
  .mdetail-in{padding:4px 17px 15px;}
  .dline{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line2);}
  .dline:last-child{border-bottom:none;}
  .dline .l{color:var(--muted2);display:flex;align-items:center;gap:8px;}
  .dline .r{font-weight:600;}
  .dline .l .pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;border:1.5px solid var(--muted2);background:transparent;}
  .dline .l .pdot.done{background:var(--accent);border-color:var(--accent);}
  .dline .l .pdot.some{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent);}
  .dline .l .pcount{font-size:10px;color:var(--muted2);opacity:.7;}
  .dsub{font-size:10.5px;color:var(--muted2);padding:7px 0 2px;letter-spacing:.07em;text-transform:uppercase;}

  .strip{display:flex;gap:9px;margin:12px 0;}
  .scell{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 13px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);}
  .scell .k{font-size:10.5px;color:var(--muted2);}
  .scell .v{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:18px;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .scell .v.green{color:var(--accent);} .scell .v.gold{color:var(--gold);} .scell .v.warn{color:var(--warn);} .scell .v.neg{color:var(--danger);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:13px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);}
  .month-nav button{background:var(--glass-strong);border:1px solid var(--line2);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;transition:background .15s;}
  .month-nav button:active{background:var(--accent-dim);}
  .month-nav .mlabel{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:18px;text-align:center;letter-spacing:-.01em;}
  .month-nav .mlabel small{display:block;font-size:9.5px;color:var(--muted2);font-weight:400;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;}

  .bgroup-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);margin:16px 6px 8px;display:flex;justify-content:space-between;}
  .brow{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line2);}
  .brow:last-child{border-bottom:none;}
  .brow .nm{font-size:14px;display:flex;align-items:center;gap:8px;}
  .brow .nm .rec{font-size:8.5px;color:var(--accent);border:1px solid var(--accent-dim);padding:1px 6px;border-radius:6px;letter-spacing:.05em;}
  .brow .nm .rec.ovr{color:var(--warn);border-color:rgba(243,201,139,.4);}
  .brow .fixedit{cursor:pointer;}
  .brow .amt.fixedit{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
  .scope-seg button.act-in{background:var(--accent-dim);border-color:var(--accent);color:var(--ink);}
  .scope-seg button.act-out{background:rgba(243,201,139,.2);border-color:var(--warn);color:var(--ink);}
  .brow .amt{font-weight:600;font-size:14px;}
  .brow .amt.in{color:var(--accent);} .brow .amt.out{color:var(--danger);}
  .brow .del{color:var(--muted2);opacity:.4;font-size:14px;padding-left:10px;}
  .brow .del:active{color:var(--danger);opacity:1;}
  /* sleep-handle om volgorde te wijzigen */
  .drag-h{flex:0 0 auto;color:var(--muted2);opacity:.4;font-size:15px;cursor:grab;touch-action:none;padding:0 4px;line-height:1;user-select:none;-webkit-user-select:none;}
  .drag-h:active{cursor:grabbing;opacity:.8;}
  .brow .nm .drag-h{margin-right:2px;}
  .dragging{opacity:.96;box-shadow:0 12px 30px rgba(0,0,0,.45);border-radius:14px;transition:box-shadow .15s;}
  .drop-line{height:0;border-top:2px solid var(--accent);margin:-1px 6px;border-radius:2px;box-shadow:0 0 6px rgba(95,208,122,.5);pointer-events:none;}
  .btotal{display:flex;justify-content:space-between;padding:15px;background:var(--glass-strong);font-weight:600;border-top:1px solid var(--line);}
  .btotal .v{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .btotal .v.over{color:var(--accent);}

  .proj{margin-bottom:11px;}
  .proj-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:15px 17px;cursor:pointer;}
  .proj-h .drag-h{margin-top:2px;}
  .proj-h .figs{margin-top:1px;}
  .proj-h .proj-drag{font-size:15px;}
  .proj-h .proj-caret{flex:0 0 auto;color:var(--muted2);opacity:.45;font-size:13px;transition:transform .25s;margin-top:3px;}
  .proj.open .proj-h .proj-caret{transform:rotate(180deg);}
  .proj-h .nm{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;}
  .proj-h .nm .nm-top{display:flex;align-items:center;gap:8px;min-width:0;}
  .proj-h .nm .nm-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .proj.open .proj-h .nm .pn{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;}
  .proj.open .proj-h .nm .pn:active{text-decoration-color:var(--muted2);}
  .proj.open .proj-h .nm .mnwrap{cursor:pointer;}
  .proj-h .nm .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proj-h .nm .mnwrap{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto;}
  .proj-h .nm .mn{font-size:10px;padding:3px 8px;border-radius:7px;font-weight:600;letter-spacing:.02em;}
  .proj-h .nm .mn-main{color:var(--accent);background:var(--accent-dim);}
  .proj-h .nm .mn-sub{color:var(--muted2);background:var(--glass-soft);font-weight:500;opacity:.85;}
  .proj-h .figs{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .proj-h .figs b{font-size:16px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15;}
  .proj-h .figs b.done{color:var(--accent);}
  .proj-h .figs b.over{color:var(--warn);}
  .proj-h .figs .sub{font-size:10.5px;color:var(--muted2);font-variant-numeric:tabular-nums;}
  .proj-h .nm .paybadge{flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .proj-h .nm .paybadge.all{color:var(--accent-ink);background:var(--accent);}
  .proj-h .nm .paybadge.some{color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-dim);}
  .proj-h .nm .paybadge.deduct{color:var(--gold);background:rgba(240,217,160,.13);border:1px solid rgba(240,217,160,.3);}
  .proj.allpaid .proj-h .nm .pn{color:var(--muted);}
  .proj.allpaid{opacity:.82;}
  .proj-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .proj.open .proj-body{max-height:1600px;}
  /* gedeelde kolom-uitlijning: vinkje | naam | begroot | realiteit | verwijder */
  .pcols-head,.pitem,.ptot{display:grid;grid-template-columns:24px 1fr 80px 80px 22px;align-items:center;gap:6px;padding:0 17px;}
  .pcols-head{height:30px;border-top:1px solid var(--line2);color:var(--muted2);font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;}
  .pcols-head .ch-num{text-align:right;}
  .pitem{min-height:46px;padding-top:9px;padding-bottom:9px;border-top:1px solid var(--line2);font-size:13px;}
  .pitem .chk{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent-ink);cursor:pointer;transition:all .15s;}
  .pitem .chk.on{background:var(--accent);border-color:var(--accent);font-weight:700;}
  .pitem .pname{min-width:0;}
  .pitem .pname .t{display:flex;align-items:center;gap:6px;font-weight:500;min-width:0;}
  .pitem .pname .t .drag-h{flex:0 0 auto;font-size:13px;}
  .pitem .pname .t .nmtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pitem .pname .meta{display:flex;align-items:center;gap:7px;margin-top:4px;}
  .pitem .pname .imn{font-size:9px;color:var(--muted2);background:var(--glass-soft);border:1px solid var(--line2);padding:1px 6px;border-radius:6px;font-weight:600;letter-spacing:.03em;}
  .pitem .pname .dt{font-size:9.5px;color:var(--muted2);}
  .pitem .pedit{cursor:pointer;}
  .col-beg{text-align:right;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;}
  .col-rea{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}
  .col-rea.filled{color:var(--accent);}
  .col-rea.over{color:var(--warn);}
  .col-rea.empty{color:var(--muted2);font-weight:400;}
  .col-rea.est{color:var(--muted2);font-weight:400;font-style:italic;}
  .pitem .x{color:var(--muted2);opacity:.3;text-align:center;font-size:13px;}
  .pitem .x:active{color:var(--danger);opacity:1;}
  /* betaald: doorgestreept maar leesbaar */
  .pitem.paid .pname .t{text-decoration:line-through;text-decoration-color:var(--muted2);color:var(--muted2);}
  .pitem.paid .col-beg,.pitem.paid .col-rea{text-decoration:line-through;text-decoration-color:var(--muted2);opacity:.7;}
  .pitem.paid .col-rea.filled{color:var(--accent);opacity:.85;}
  .pitem.paid .col-rea.over{color:var(--warn);opacity:.85;}
  .proj-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line2);}
  .padd{padding:13px 17px;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;}
  .padd:active{opacity:.6;}
  .paidall{padding:13px 17px;color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .paidall:active{color:var(--accent);}
  /* totaal: duidelijk afgescheiden */
  .ptot{min-height:50px;padding-top:13px;padding-bottom:13px;border-top:2px solid var(--line);background:var(--glass-strong);}
  .ptot .ptot-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink);}
  .ptot .col-beg{font-size:14px;font-weight:600;color:var(--muted);}
  .ptot .col-rea{font-size:15px;font-weight:700;color:var(--ink);}
  .ptot .col-rea.filled{color:var(--accent);}
  .ptot .col-rea.over{color:var(--warn);}
  .new-proj{width:100%;background:var(--glass-soft);border:1px dashed var(--line);color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px;padding:15px;border-radius:16px;cursor:pointer;margin-bottom:11px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  /* huis-overzicht bovenaan projecten */
  .house-card{margin-top:6px;margin-bottom:14px;}
  .house-h{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 17px;cursor:pointer;}
  .house-h .house-lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);font-weight:600;}
  .house-h .house-net{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px;}
  .house-h .house-sub{font-size:11.5px;color:var(--muted2);margin-top:2px;}
  .house-h .house-cog{flex:0 0 auto;color:var(--muted2);opacity:.5;font-size:15px;}
  .house-h:active .house-cog{opacity:1;color:var(--accent);}
  .house-detail{padding:4px 17px 15px;border-top:1px solid var(--line2);}
  .house-detail .hline{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line2);}
  .house-detail .hline:last-child{border-bottom:none;}
  .house-detail .hline .l{color:var(--muted2);}
  .house-detail .hline .r{font-weight:600;font-variant-numeric:tabular-nums;}
  .house-detail .hline.tot{margin-top:2px;border-top:1px solid var(--line);padding-top:11px;}
  .house-detail .hline.tot .l{color:var(--ink);font-weight:600;}
  .house-detail .hline.tot .r{font-size:14px;font-weight:700;color:var(--accent);}
  .house-extra{margin-top:2px;border-top:2px solid var(--line);}
  .house-detail .hline.grand{cursor:pointer;border-bottom:none;padding-top:12px;}
  .house-detail .hline.grand .l{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:6px;}
  .house-detail .hline.grand .r{font-size:15px;font-weight:700;color:var(--accent);}
  .house-extra .hcaret{font-size:11px;color:var(--muted2);transition:transform .25s;display:inline-block;}
  .house-extra.open .hcaret{transform:rotate(180deg);}
  .house-extra-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .house-extra.open .house-extra-body{max-height:400px;}
  .house-extra-note{font-size:11px;color:var(--muted2);line-height:1.5;padding:6px 0 2px;}

  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-bottom));z-index:40;
    background:var(--glass-strong);color:var(--ink);border:1px solid rgba(255,255,255,.22);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:14.5px;
    padding:14px 24px;border-radius:999px;display:flex;align-items:center;gap:8px;
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 10px 32px rgba(60,54,48,.34);cursor:pointer;transition:transform .12s;}
  .fab:active{transform:translateX(-50%) scale(.95);}
  .fab .plus{font-size:19px;margin-top:-2px;color:var(--accent);}

  .scrim{position:fixed;inset:0;background:rgba(15,13,11,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}

const KEY='hagestraat_v2';
let S=load();
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):defaultState();}catch(e){return defaultState();}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function euro(n){const neg=n<0;n=Math.abs(Math.round(n));return (neg?'−€':'€')+n.toLocaleString('nl-NL');}
function uid(){return 'x'+Date.now()+Math.floor(Math.random()*999);}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthFromDate(iso){ if(!iso)return null; const mm=parseInt(iso.slice(5,7),10); return MONTHS[mm-1]||null; }
function fmtDate(iso){ if(!iso)return ''; const p=iso.split('-'); if(p.length!==3)return iso; return parseInt(p[2],10)+' '+MFULL[MONTHS[parseInt(p[1],10)-1]]; }
// zet betaalmaand op basis van datum (of verwijder override als gelijk aan projectmaand)
function applyDateMonth(p,it){ const m=monthFromDate(it.date); if(m){ if(m!==p.month) it.month=m; else delete it.month; } }

function incomeForMonth(m){
  let t=0;
  for(const r of S.income){
    if(r.recurring){ t += (r.months&&r.months[m]!=null)?r.months[m]:r.amount; }
    else if(r.byMonth&&r.byMonth[m]!=null){ t+=r.byMonth[m]; }
  }
  return t;
}
// een vaste last heeft een basis-bedrag (amount) en optioneel per-maand uitzonderingen (overrides[maand])
function fixedAmount(f,m){ return (f.overrides && f.overrides[m]!=null) ? +f.overrides[m] : (+f.amount||0); }
function fixedTotal(m){ return S.fixed.reduce((s,f)=>s+fixedAmount(f,m),0); }
function overForMonth(m){ return incomeForMonth(m) - fixedTotal(m); }
function itemCost(it){ return (it.actual!=null && it.actual!=='') ? +it.actual : (+it.budget||0); }
function itemMonth(p,it){ return it.month || p.month; }
function projectCostsForMonth(m){
  let t=0;
  for(const p of S.projects){ for(const it of p.items){ if(itemMonth(p,it)===m) t+=itemCost(it); } }
  return t;
}
function projectTotals(p){ let b=0,a=0; for(const it of p.items){ b+=(+it.budget||0); a+=itemCost(it);} return {budget:b,actual:a}; }
function buildModel(){
  let bal=+S.start; const rows=[];
  for(const m of MONTHS){
    const begin=bal; const inleg=overForMonth(m); const proj=projectCostsForMonth(m);
    bal=begin+inleg-proj; rows.push({m,begin,inleg,proj,end:bal});
  }
  return rows;
}

function renderModel(){
  const rows=buildModel();
  const nowIdx=MONTHS.indexOf(CURRENT_MONTH);
  document.getElementById('sStart').textContent=euro(S.start);
  document.getElementById('sBuffer').textContent=euro(S.buffer);
  const end=rows[11];
  const sEnd=document.getElementById('sEnd');
  sEnd.textContent=euro(end.end); sEnd.className='v '+(end.end<0?'neg':(end.end<S.buffer?'warn':'green'));
  const box=document.getElementById('modelRows');box.innerHTML='';
  const pastCount = Math.max(0, rows.findIndex(r=>MONTHS.indexOf(r.m)===nowIdx));
  // container voor voorbije maanden (standaard ingeklapt)
  let pastBox=null;
  if(pastCount>0){
    const toggle=document.createElement('button');
    toggle.className='past-toggle'+(showPast?' open':'');
    toggle.innerHTML=`<span>${showPast?'Verberg':'Toon'} ${pastCount} voorbije maand${pastCount>1?'en':''}</span><span class="chev">▾</span>`;
    toggle.onclick=()=>{ showPast=!showPast; renderModel(); };
    box.appendChild(toggle);
    pastBox=document.createElement('div');
    pastBox.className='past-group'+(showPast?' show':'');
    box.appendChild(pastBox);
  }
  rows.forEach((r,idx)=>{
    const cls=r.end<0?'neg':(r.end<S.buffer?'low':'');
    const state=idx<nowIdx?'past':(idx===nowIdx?'now':'');
    const wrap=document.createElement('div'); wrap.className='card mrow-wrap'+(state==='now'?' now-wrap':'');
    wrap.innerHTML=`
      <div class="mrow ${cls} ${state}">
        <div class="mtop">
          <div class="mtitle">${MFULL[r.m]}<span class="yr">2026</span>${state==='now'?'<span class="now-badge">NU</span>':''}</div>
          <div class="mend ${cls}">${euro(r.end)}</div>
        </div>
        <div class="mflow">
          <span class="pill begin">begin <b>${euro(r.begin)}</b></span>

function projectChipsForMonth(m){
  // bedrag per project dat in deze maand valt, gesorteerd op grootte
  const tally={};
  for(const p of S.projects){
    for(const it of p.items){
      if(itemMonth(p,it)===m){ tally[p.name]=(tally[p.name]||0)+itemCost(it); }
    }
  }
  const names=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]);
  if(!names.length) return '';
  const peak=names[0];
  const chips=names.map(n=>`<span class="pchip ${n===peak?'pchip-main':''}">${escapeHtml(n)}</span>`).join('');
  return `<div class="mchips">${chips}</div>`;
}
function projectLinesForMonth(m){
  // groepeer per project: één regel met het projecttotaal voor deze maand
  const groups=[];
  for(const p of S.projects){
    let total=0, count=0, paidCount=0, actualCount=0;
    for(const it of p.items){
      if(itemMonth(p,it)===m){
        total+=itemCost(it); count++;
        if(it.paid) paidCount++;
        if(it.actual!=null&&it.actual!=='') actualCount++;
      }
    }
    if(count>0) groups.push({name:p.name,total,count,paidCount,actualCount});
  }
  if(!groups.length) return '<div class="dsub" style="margin-top:8px">Geen projectkosten deze maand</div>';
  groups.sort((a,b)=>b.total-a.total);
  const lines=groups.map(g=>{
    // statusbolletje: groen=alles betaald, half=deels, leeg=nog niks
    const dot = g.paidCount===g.count ? '<span class="pdot done"></span>'
              : (g.paidCount>0 ? '<span class="pdot some"></span>' : '<span class="pdot"></span>');
    const sub = g.count>1 ? `<span class="pcount">${g.count}×</span>` : '';
    return `<div class="dline"><span class="l">${dot}${escapeHtml(g.name)} ${sub}</span><span class="r" style="color:var(--danger)">${euro(-g.total)}</span></div>`;
  }).join('');
  return '<div class="dsub" style="margin-top:8px">Projectkosten</div>'+lines;
}

function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// Maakt rijen binnen een container sleepbaar (touch + muis) via een handle.
// rowSel: selector van de sleepbare rijen; idAttr: data-attribuut met de id.
// onReorder(newIdOrder) krijgt de nieuwe volgorde van id's terug.
function makeReorderable(container, rowSel, idAttr, onReorder, handleSel){
  handleSel=handleSel||'.drag-h';
  container.querySelectorAll(rowSel).forEach(row=>{
    const handle=row.querySelector(handleSel);
    if(!handle) return;
    let rows=[], startY=0, startTop=0, lastY=0, dropLine=null, moved=false;

    handle.addEventListener('click', e=>{ e.stopPropagation(); });
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      rows=Array.from(container.querySelectorAll(rowSel));
      startY=e.clientY; lastY=e.clientY; moved=false;
      const r=row.getBoundingClientRect();
      startTop=r.top;
      // licht de rij op: zweeft mee, blijft op zijn plek tot je beweegt
      row.classList.add('dragging');
      row.style.zIndex='50';
      row.style.position='relative';
      // drop-lijn die de landplek toont
      dropLine=document.createElement('div');
      dropLine.className='drop-line';
      handle.setPointerCapture(e.pointerId);
    });

    handle.addEventListener('pointermove', e=>{
      if(!rows.length) return;
      e.preventDefault();
      const dy=e.clientY-startY;
      if(Math.abs(dy)>3) moved=true;
      lastY=e.clientY;
      // de rij beweegt mee onder de vinger
      row.style.transform=`translateY(${dy}px) scale(1.02)`;
      // bepaal landplek: rij waarvan het midden het dichtst bij de vinger ligt
      const y=e.clientY;
      let target=null, after=false;
      for(const r of rows){
        if(r===row) continue;
        const b=r.getBoundingClientRect();
        if(y>=b.top-4 && y<=b.bottom+4){
          target=r; after = y > b.top + b.height/2; break;
        }
      }
      if(target){
        if(after){ target.after(dropLine); } else { target.before(dropLine); }
      } else if(rows.length){
        const first=rows.find(r=>r!==row), last=[...rows].reverse().find(r=>r!==row);
        if(first && y < first.getBoundingClientRect().top){ first.before(dropLine); }
        else if(last){ last.after(dropLine); }
      }
    });

    const finish=e=>{
      if(!rows.length) return;
      // plaats de rij op de positie van de drop-lijn
      if(dropLine && dropLine.parentNode){ dropLine.parentNode.insertBefore(row, dropLine); dropLine.remove(); }
      row.classList.remove('dragging');
      row.style.transform=''; row.style.zIndex=''; row.style.position=''; 
      try{handle.releasePointerCapture(e.pointerId);}catch(_){}
      const wasMoved=moved;
      rows=[]; dropLine=null;
      if(wasMoved){
        const newOrder=Array.from(container.querySelectorAll(rowSel)).map(r=>r.getAttribute(idAttr));
        onReorder(newOrder);
      }
    };
    handle.addEventListener('pointerup', finish);
    handle.addEventListener('pointercancel', finish);
  });
}
// herschik een array: alleen de zichtbare id's (idOrder) worden onderling herordend,
// items die niet in idOrder zitten behouden hun relatieve plek.
function reorderArrayById(arr, idOrder, idKey){
  const visibleSet=new Set(idOrder);
  const byId={}; arr.forEach(o=>byId[o[idKey]]=o);
  const reordered=idOrder.map(id=>byId[id]).filter(Boolean);
  let vi=0;
  return arr.map(o=> visibleSet.has(o[idKey]) ? reordered[vi++] : o );
}

    <div id="quickInner"></div>`;
  document.getElementById('qProj').onclick=()=>{document.getElementById('qProj').className='act-out';document.getElementById('qBal').className='';quickProjForm();};
  document.getElementById('qBal').onclick=()=>{document.getElementById('qBal').className='act-in';document.getElementById('qProj').className='';quickBalForm();};
  quickProjForm();
  scrim.classList.add('show');sheet.classList.add('show');
}
function quickProjForm(){
  document.getElementById('quickInner').innerHTML=projItemFields()+`
    <div class="field"><label>Aan welk project?</label><select id="fProjSel">${S.projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
    <button class="save" id="saveItemQuick">Opslaan</button>`;
  document.getElementById('saveItemQuick').onclick=()=>saveItem(document.getElementById('fProjSel').value);
}
function quickBalForm(){ document.getElementById('quickInner').innerHTML=balFields()+`<button class="save" id="saveBalQuick">Opslaan</button>`; wireBal(); document.getElementById('saveBalQuick').onclick=saveBal; }

function projItemFields(){
  return `
  <div class="field"><label>Wat is het?</label><input type="text" id="fName" placeholder="bijv. Wasmachine" autocomplete="off"></div>
  <div class="row2">
    <div class="field"><label>Begroot (€)</label><input type="number" id="fBudget" inputmode="decimal" placeholder="0"></div>
    <div class="field"><label>Realiteit (€)</label><input type="number" id="fActual" inputmode="decimal" placeholder="leeg = nog niet"></div>
  </div>
  <div class="hintline">Vul realiteit pas in als je echt betaald hebt — dan telt dat bedrag mee in je vermogensmodel.</div>
  <div class="field"><label>Betaalmaand</label><select id="fMonth">${monthOpts(CURRENT_MONTH)}</select></div>`;
}
function openItemSheet(projId, fromFab){
  document.getElementById('sheetTitle').textContent='Post toevoegen';
  const p=S.projects.find(x=>x.id===projId);
  document.getElementById('sheetSub').textContent=fromFab?'Kies project en vul in.':'Aan project: '+p.name;
  document.getElementById('formArea').innerHTML=projItemFields()+
    (fromFab?`<div class="field"><label>Aan welk project?</label><select id="fProjSel">${S.projects.map(pp=>`<option value="${pp.id}">${escapeHtml(pp.name)}</option>`).join('')}</select></div>`:'')+
    `<button class="save" id="saveItemBtn">Opslaan</button>`;
  document.getElementById('saveItemBtn').onclick=()=>saveItem(fromFab?document.getElementById('fProjSel').value:projId);
  scrim.classList.add('show');sheet.classList.add('show');
}
function saveItem(projId){
  const name=document.getElementById('fName').value.trim()||'Naamloos';
  const budget=parseFloat(document.getElementById('fBudget').value)||0;
  const av=document.getElementById('fActual').value;
  const actual=av===''?null:parseFloat(av);
  const month=document.getElementById('fMonth').value;
  const p=S.projects.find(x=>x.id===projId);
  const item={id:uid(),name,budget,actual,date:''};
  if(month!==p.month) item.month=month;
  p.items.push(item);
  persist();renderAll();closeSheets();toast('Post toegevoegd ✓');
}

// ----- bestaand onderdeel bewerken (titel, begroot, realiteit, betaalmaand) -----
function openEditItem(projId,itemId){
  const p=S.projects.find(x=>x.id===projId); if(!p)return;
  const it=p.items.find(x=>x.id===itemId); if(!it)return;
  const im=it.month||p.month;
  document.getElementById('sheetTitle').textContent='Onderdeel bewerken';
  document.getElementById('sheetSub').textContent=p.name;
  document.getElementById('formArea').innerHTML=projItemFields()+`<button class="save" id="saveEditItemBtn">Opslaan</button>`;
  // pre-fill
  document.getElementById('fName').value=it.name||'';
  document.getElementById('fBudget').value=(it.budget!=null?it.budget:'');
  document.getElementById('fActual').value=(it.actual!=null&&it.actual!=='')?it.actual:'';
  document.getElementById('fMonth').innerHTML=monthOpts(im);
  // als de post al betaald is: betaaldatum tonen en aanpasbaar maken
  if(it.paid){
    const fa=document.getElementById('formArea');
    const dateField=document.createElement('div');
    dateField.className='field';
    dateField.innerHTML=`<label>Betaaldatum</label><input type="date" id="fPaidDate" value="${it.date||todayISO()}">`;
    fa.insertBefore(dateField, document.getElementById('saveEditItemBtn'));
  }
  document.getElementById('saveEditItemBtn').onclick=()=>{
    const name=document.getElementById('fName').value.trim()||'Naamloos';
    const budget=parseFloat(document.getElementById('fBudget').value)||0;
    const av=document.getElementById('fActual').value;
    const actual=av===''?null:parseFloat(av);
    let month=document.getElementById('fMonth').value;
    it.name=name; it.budget=budget; it.actual=actual;
    // betaaldatum (alleen aanwezig als post betaald is); maand volgt die datum
    const pd=document.getElementById('fPaidDate');
    if(pd){ it.date=pd.value; const dm=monthFromDate(pd.value); if(dm) month=dm; }
    if(month!==p.month){ it.month=month; } else { delete it.month; }
    persist();renderAll();closeSheets();toast('Aangepast ✓');
  };
  scrim.classList.add('show');sheet.classList.add('show');
}

// ----- projectnaam + standaard-maand bewerken -----
function openEditProject(projId){
  const p=S.projects.find(x=>x.id===projId); if(!p)return;
  document.getElementById('sheetTitle').textContent='Project bewerken';
  document.getElementById('sheetSub').textContent='Pas de naam of standaard-betaalmaand aan.';
  document.getElementById('formArea').innerHTML=`
    <div class="field"><label>Projectnaam</label><input type="text" id="epName" autocomplete="off" value="${escapeHtml(p.name)}"></div>
    <div class="field"><label>Standaard betaalmaand</label><select id="epMonth">${monthOpts(p.month)}</select></div>
    <div class="hintline">De standaardmaand geldt voor onderdelen zonder eigen betaalmaand.</div>
    <div class="field"><label>Aftrek koopprijs woning (€)</label><input type="number" id="epDeduct" inputmode="decimal" placeholder="0" value="${p.deduction!=null?p.deduction:''}"></div>
    <div class="hintline">Doe je dit onderdeel zelf in plaats van de verkoper? Vul het bedrag in dat van de koopprijs af gaat. Laat leeg als dat niet zo is.</div>
    <button class="save" id="epSave">Opslaan</button>
    <div class="footlink" style="margin:14px 0 4px"><a id="epDel">🗑 Heel project verwijderen</a></div>`;
  document.getElementById('epSave').onclick=()=>{
    const name=document.getElementById('epName').value.trim()||p.name;
    const month=document.getElementById('epMonth').value;
    const dv=document.getElementById('epDeduct').value;
    p.name=name; p.month=month;
    if(dv===''||parseFloat(dv)===0){ delete p.deduction; } else { p.deduction=parseFloat(dv)||0; }
    persist();renderAll();closeSheets();toast('Aangepast ✓');
  };
  document.getElementById('epDel').onclick=()=>{
    if(confirm('Project "'+p.name+'" en alle onderdelen verwijderen?')){
      closeSheets();
      removeWithUndo('Project verwijderd',()=>S.projects,(snap)=>{S.projects=snap;},()=>{S.projects=S.projects.filter(x=>x.id!==projId);});
    }
  };
  scrim.classList.add('show');sheet.classList.add('show');
}

function balFields(){
  return `
  <div class="field"><div class="seg">
    <button id="bIn" class="act-in">+ Inkomst</button>
    <button id="bOut">− Vaste last</button>
  </div></div>
  <div class="field"><label>Naam</label><input type="text" id="bName" placeholder="bijv. Belastingteruggave" autocomplete="off"></div>
  <div class="field"><label>Bedrag (€)</label><input type="number" id="bAmt" inputmode="decimal" placeholder="0"></div>
  <div id="bMonthWrap" class="field"><label>Maand</label><select id="bMonth">${monthOpts(MONTHS[bMonthIdx])}</select></div>
  <div class="field"><div class="recur-toggle" id="bRecur"><div class="box">✓</div><div class="t">Elke maand<small>Vaste last of vast inkomen</small></div></div></div>`;
}
let balType='in',balRecur=false;
function openBalansSheet(){
  document.getElementById('sheetTitle').textContent='Toevoegen aan balans';
  document.getElementById('sheetSub').textContent='Inkomst of vaste last.';
  document.getElementById('formArea').innerHTML=balFields()+`<button class="save" id="saveBalBtn">Opslaan</button>`;
  wireBal(); document.getElementById('saveBalBtn').onclick=saveBal;
  scrim.classList.add('show');sheet.classList.add('show');
}
function wireBal(){
  balType='in';balRecur=false;
  const setT=t=>{balType=t;document.getElementById('bIn').className=t==='in'?'act-in':'';document.getElementById('bOut').className=t==='out'?'act-out':'';
    document.getElementById('bMonthWrap').style.display=(t==='out')?'none':'block';};
  document.getElementById('bIn').onclick=()=>setT('in');
  document.getElementById('bOut').onclick=()=>setT('out');
  const rt=document.getElementById('bRecur');
  rt.onclick=()=>{balRecur=!balRecur;rt.classList.toggle('on',balRecur);};
  setT('in');
}
function saveBal(){
  const name=document.getElementById('bName').value.trim()||'Naamloos';
  const amt=parseFloat(document.getElementById('bAmt').value)||0;
  if(amt<=0){toast('Vul een bedrag in');return;}
  if(balType==='out'){ S.fixed.push({id:uid(),name,amount:amt}); }
  else {
    const month=document.getElementById('bMonth').value;
    if(balRecur){ S.income.push({id:uid(),name,recurring:true,amount:amt,months:{}}); }
    else { S.income.push({id:uid(),name,recurring:false,byMonth:{[month]:amt}}); }
  }
  persist();renderAll();closeSheets();toast('Opgeslagen ✓');
}

// ----- bewerk een vaste last: alle maanden of alleen deze maand -----
let editFixState={id:null,month:null,scope:'all'};
function openEditFixed(id,m){
  const f=S.fixed.find(x=>x.id===id); if(!f)return;
  const cur=fixedAmount(f,m);
  const hasOverride=f.overrides && f.overrides[m]!=null;
  editFixState={id,month:m,scope: hasOverride?'this':'all'};
  document.getElementById('sheetTitle').textContent=f.name;
  document.getElementById('sheetSub').textContent='Pas het bedrag aan voor '+MFULL[m]+'.';
  document.getElementById('formArea').innerHTML=`
    <div class="field"><label>Naam</label><input type="text" id="efName" autocomplete="off" value="${escapeHtml(f.name)}"></div>
    <div class="field"><label>Bedrag (€)</label><input type="number" id="efAmt" inputmode="decimal" value="${cur}"></div>
    <div class="field"><label>Bedrag geldt voor</label>
      <div class="seg scope-seg">
        <button id="efAll">Alle maanden</button>
        <button id="efThis">Alleen ${m}</button>
      </div>
    </div>
    <div class="hintline" id="efHint"></div>
    ${hasOverride?`<div class="footlink" style="margin:2px 0 14px"><a id="efClear">↺ Uitzondering voor ${m} verwijderen</a></div>`:''}
    <button class="save" id="efSave">Opslaan</button>`;
  const setScope=s=>{
    editFixState.scope=s;
    document.getElementById('efAll').className=s==='all'?'act-in':'';
    document.getElementById('efThis').className=s==='this'?'act-out':'';
    document.getElementById('efHint').textContent = s==='all'
      ? 'Past het standaardbedrag aan voor elke maand (behalve maanden met een eigen uitzondering).'
      : 'Alleen '+MFULL[m]+' wijkt af; de andere maanden blijven '+euro(+f.amount||0)+'.';
  };
  document.getElementById('efAll').onclick=()=>setScope('all');
  document.getElementById('efThis').onclick=()=>setScope('this');
  setScope(editFixState.scope);
  const clr=document.getElementById('efClear');
  if(clr) clr.onclick=()=>{ if(f.overrides){delete f.overrides[m];} persist();renderAll();closeSheets();toast('Uitzondering verwijderd'); };
  document.getElementById('efSave').onclick=()=>{
    const v=parseFloat(document.getElementById('efAmt').value);
    if(isNaN(v)||v<0){toast('Vul een bedrag in');return;}
    const nm=document.getElementById('efName').value.trim();
    if(nm) f.name=nm;
    if(editFixState.scope==='all'){ f.amount=v; }
    else { if(!f.overrides)f.overrides={}; f.overrides[m]=v; }
    persist();renderAll();closeSheets();toast('Aangepast ✓');
  };
  scrim.classList.add('show');sheet.classList.add('show');
}

document.getElementById('newProjBtn').onclick=()=>{
  document.getElementById('sheetTitle').textContent='Nieuw project';
  document.getElementById('sheetSub').textContent='Groepeer kosten onder een noemer.';
  document.getElementById('formArea').innerHTML=`
    <div class="field"><label>Projectnaam</label><input type="text" id="npName" placeholder="bijv. Tuin"></div>
    <div class="field"><label>Standaard betaalmaand</label><select id="npMonth">${monthOpts(CURRENT_MONTH)}</select></div>
    <button class="save" id="npSave">Project aanmaken</button>`;
  document.getElementById('npSave').onclick=()=>{
    const name=document.getElementById('npName').value.trim()||'Nieuw project';
    const month=document.getElementById('npMonth').value;
    S.projects.push({id:uid(),name,month,items:[]});
    persist();renderAll();closeSheets();toast('Project aangemaakt ✓');
  };
  scrim.classList.add('show');sheet.classList.add('show');
};

document.getElementById('openSettings').onclick=()=>{
  document.getElementById('setStart').value=S.start;
  document.getElementById('setBuffer').value=S.buffer;
  scrim.classList.add('show');setSheet.classList.add('show');
};
document.getElementById('setSave').onclick=()=>{
  S.start=parseFloat(document.getElementById('setStart').value)||0;
  S.buffer=parseFloat(document.getElementById('setBuffer').value)||0;
  persist();renderAll();closeSheets();toast('Bewaard ✓');
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Terug naar de oorspronkelijke Excel-data? Eigen toevoegingen gaan verloren.')){
    S=defaultState();persist();renderAll();toast('Gereset ✓');
  }
};

// ---- Back-up: exporteren naar een bestandje ----
document.getElementById('exportBtn').onclick=()=>{
  try{
    const data=JSON.stringify(S,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.href=url; a.download='hagestraat-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Back-up gedownload ✓');
  }catch(e){ toast('Back-up mislukt'); }
};

// ---- Back-up terugzetten: importeren uit een bestandje ----
document.getElementById('importBtn').onclick=()=>{ document.getElementById('importFile').click(); };
document.getElementById('importFile').onchange=(ev)=>{
  const file=ev.target.files&&ev.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      // simpele check of het een geldig back-upbestand is
      if(!obj || typeof obj!=='object' || !('projects' in obj) || !('income' in obj)){
        toast('Geen geldig back-upbestand'); return;
      }
      if(confirm('Back-up terugzetten? Je huidige gegevens worden vervangen.')){
        S=obj; persist(); renderAll(); toast('Back-up teruggezet ✓');
      }
    }catch(e){ toast('Bestand kon niet gelezen worden'); }
    ev.target.value=''; // reset zodat hetzelfde bestand opnieuw kan
  };
  reader.readAsText(file);
};

let toastT;
function toast(m, undoFn){
  const t=document.getElementById('toast');
  clearTimeout(toastT);
  t.innerHTML = `<span class="tmsg">${m}</span>` + (undoFn?`<button class="undo-btn" id="undoBtn">Ongedaan maken</button>`:'');
  t.classList.add('show');
  if(undoFn){
    document.getElementById('undoBtn').onclick=()=>{ undoFn(); clearTimeout(toastT); t.classList.remove('show'); };
    toastT=setTimeout(()=>t.classList.remove('show'),5000); // langer zichtbaar bij undo
  } else {
    toastT=setTimeout(()=>t.classList.remove('show'),1500);
  }
}
// verwijder met mogelijkheid tot terugdraaien.
// getArr/setArr verwijzen naar de array; doRemove voert de verwijdering uit.
function removeWithUndo(msg, getArr, setArr, doRemove){
  const snapshot=JSON.parse(JSON.stringify(getArr())); // staat VÓÓR verwijderen
  doRemove();
  persist();renderAll();
  toast(msg, ()=>{ setArr(snapshot); persist();renderAll();toast('Teruggezet ✓'); });
}

renderAll();
</script>
</body>
</html>
